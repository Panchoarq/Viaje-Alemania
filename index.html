<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marco Polo</title>
<meta name="theme-color" content="#efe6d2">
<link rel="icon" href="img/logo-marcopolo.jpg">
<link rel="apple-touch-icon" href="img/logo-marcopolo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
:root{--paper:#fffdf6;--desk:#efe6d2;--ink:#2a2219;--muted:#76695a;--line:#d8cba9;--red:#a8352b;--grid:rgba(91,139,201,.18);
  --f-mono:"Courier Prime",ui-monospace,Menlo,monospace;--f-body:"Source Serif 4",Georgia,serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--desk);color:var(--ink);font:16px/1.45 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
main{max-width:760px;margin:0 auto;padding-block:max(28px,env(safe-area-inset-top,0px)) 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:26px}
.logo{justify-self:center;width:min(300px,72vw);background:var(--paper);padding:9px 9px 12px;border-radius:6px;transform:rotate(-2deg);box-shadow:0 1px 0 rgba(0,0,0,.06),0 14px 30px rgba(40,25,10,.28);position:relative}
.logo::after{content:"";position:absolute;top:-11px;left:50%;width:80px;height:24px;margin-left:-40px;background:rgba(233,220,180,.85);transform:rotate(3deg)}
.logo img{display:block;width:100%;border-radius:3px}
h1{font:700 15px var(--f-mono);letter-spacing:.18em;text-transform:uppercase;text-align:center;margin:0;color:var(--muted)}
.trips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.trip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px;padding:16px 16px 14px;box-shadow:0 2px 0 rgba(0,0,0,.04),0 8px 18px rgba(40,25,10,.12);transition:transform .15s ease}
.trip:hover,.trip:focus-visible{transform:translateY(-2px) rotate(-.3deg)}
.trip:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.flag{grid-row:span 3;font-size:34px;line-height:1}
.trip b{font:700 21px/1.2 var(--f-body)}
.trip small{font:13px var(--f-mono);color:var(--muted)}
.tag{justify-self:start;font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1.5px solid currentColor;margin-top:4px}
.tag.open{color:#2e6b4f}.tag.priv{color:var(--red)}
.de{--c:#2f6b4f}.fr{--c:#2e4f8f}
footer{text-align:center;font:12px var(--f-mono);color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.trip{transition:none}}
</style>
</head>
<body>
<main>
  <div class="logo"><img src="img/logo-marcopolo.jpg" alt="Marco Polo · Planifica · Explora · Vive"></div>
  <h1>¿A qué viaje quieres entrar?</h1>
  <div class="trips">
    <a class="trip de" href="/alemania"><span class="flag" aria-hidden="true">🇩🇪</span><b>Viaje a Alemania</b><small>Hamburgo · Berlín · Praga · Múnich · feb 2027</small><span class="tag open">Abierto</span></a>
    <a class="trip fr" href="/paris"><span class="flag" aria-hidden="true">🇫🇷</span><b>Viaje a París</b><small>París y escapadas en tren</small><span class="tag priv">🔒 Privado · con Google</span></a>
  </div>
  <footer>Planifica · Explora · Vive</footer>
</main>
</body>
</html>
