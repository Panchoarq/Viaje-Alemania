<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viaje a París · Marco Polo</title>
<meta name="theme-color" content="#efe6d2">
<link rel="icon" href="img/logo-marcopolo.jpg">
<link rel="apple-touch-icon" href="img/logo-marcopolo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* Layout: cuaderno de viaje en papel, una columna para iPhone; barra fija con pestañas; tarjetas tipo ficha. */
:root{--paper:#fffdf6;--desk:#efe6d2;--ink:#2a2219;--muted:#76695a;--line:#d8cba9;--red:#a8352b;--blue:#2e4f8f;--ok:#2e6b4f;--warm:#f6efdd;
  --grid:rgba(91,139,201,.18);--f-mono:"Courier Prime",ui-monospace,Menlo,monospace;--f-body:"Source Serif 4",Georgia,serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--desk);color:var(--ink);font:16px/1.45 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:820px;margin:0 auto;padding-block:16px 90px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.eyebrow{font:700 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font:700 26px/1.15 var(--f-mono);margin:4px 0 2px;text-wrap:balance}
h2{font:700 20px/1.2 var(--f-body);margin:0 0 6px;text-wrap:balance}
h3{font:700 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.muted{color:var(--muted)}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.04),0 10px 24px rgba(40,25,10,.12);padding:18px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font:700 15px var(--f-body);cursor:pointer;text-decoration:none}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}
label.f{display:grid;gap:4px;font:600 13px var(--f-mono);letter-spacing:.04em;color:var(--muted)}
input,select,textarea{width:100%;min-height:44px;padding:9px 11px;border:1px solid #b9a982;border-radius:7px;background:#fff;font-size:16px}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.stack{display:grid;gap:12px}
/* cabecera */
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hdr img{width:58px;height:58px;object-fit:cover;border-radius:6px;border:4px solid var(--paper);box-shadow:0 4px 10px rgba(40,25,10,.25);transform:rotate(-4deg)}
.hdr .who{margin-left:auto;font:12px var(--f-mono);color:var(--muted);text-align:right}
.hdr .who button{border:0;background:none;color:var(--blue);text-decoration:underline;cursor:pointer;padding:0;font:inherit}
/* pestañas */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;padding:8px 0 0;background:var(--desk);overflow-x:auto;scrollbar-width:none}
.tab{flex:1 0 auto;font:700 12.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:10px 12px 9px;border:1px solid var(--line);border-bottom:0;border-top:4px solid var(--c,var(--blue));border-radius:9px 9px 0 0;background:color-mix(in srgb,var(--c,var(--blue)) 9%,var(--paper));cursor:pointer;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--paper);padding-top:12px}
.panel{border-top:0;border-radius:0 0 6px 6px}
/* login */
.gate{max-width:440px;margin:6vh auto 0;text-align:center}
.gate .logo{width:200px;margin:0 auto 14px;background:var(--paper);padding:8px 8px 11px;border-radius:6px;transform:rotate(-2deg);box-shadow:0 12px 26px rgba(40,25,10,.25)}
.gate .logo img{display:block;width:100%;border-radius:3px}
.gbtn{width:100%;background:#fff;color:#1f1f1f;border:1px solid #9a9a9a}
.or{display:flex;align-items:center;gap:10px;margin:14px 0;font:12px var(--f-mono);color:var(--muted)}
.or::before,.or::after{content:"";flex:1;border-top:1px dashed var(--line)}
.note{font-size:14px;border-left:4px solid var(--blue);background:color-mix(in srgb,var(--blue) 7%,var(--paper));padding:8px 10px;border-radius:4px;text-align:left}
.note.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 7%,var(--paper))}
/* asistente */
.steps{display:flex;gap:6px;margin:4px 0 14px}
.steps span{flex:1;height:5px;border-radius:3px;background:#e2d7bd}
.steps span.on{background:var(--red)}
.wnav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
/* línea de tiempo */
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.tl .d{font:700 12.5px/1.25 var(--f-mono);color:var(--red);font-variant-numeric:tabular-nums}
.tl b{display:block}
.tl small{color:var(--muted);font-size:13.5px}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:6px}
.cal .h{font:700 10.5px var(--f-mono);text-align:center;color:var(--muted)}
.cal .c{aspect-ratio:1;min-width:0;border-radius:5px;display:grid;place-items:center;font:700 12px var(--f-mono);background:#ece3cd;color:#a89a7c;position:relative}
.cal .c.pa{background:color-mix(in srgb,var(--blue) 16%,var(--paper));color:var(--ink)}
.cal .c.es{background:var(--c);color:#fff}
.cal .c.tr{outline:2px solid var(--red);outline-offset:-2px}
.cal .m{grid-column:1/-1;font:700 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:12px var(--f-mono);color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
/* escapadas */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chip{flex:none;font:700 12.5px var(--f-mono);padding:7px 12px;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.esc{display:grid;gap:10px}
.card{border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px;background:var(--paper);padding:12px 12px 10px;display:grid;gap:6px}
.card .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .top b{font:700 18px/1.2 var(--f-body)}
.card .flag{font-size:18px}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font:700 11.5px var(--f-mono);padding:2px 7px;border-radius:3px;background:var(--warm);border:1px dashed var(--line);white-space:nowrap}
.pill.train{background:color-mix(in srgb,var(--blue) 12%,var(--paper));border-color:transparent;color:var(--blue)}
.card p{margin:0;font-size:14.5px}
.card .act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card.sel{box-shadow:0 0 0 2px var(--c)}
.plan{border:1px dashed var(--c);border-radius:6px;padding:10px;display:grid;gap:8px;background:color-mix(in srgb,var(--c) 5%,var(--paper))}
.warn{font-size:13.5px;color:var(--red)}
/* elegidas */
.mine{display:grid;gap:8px}
.mine .it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px;padding:9px 10px;background:var(--paper)}
.mine .it .dt{font:700 12.5px var(--f-mono);color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:6px;padding:14px;text-align:center;color:var(--muted);font-size:14.5px}
.sync{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));font:600 12px system-ui,sans-serif;padding:7px 11px;border-radius:999px;background:#1f3d2b;color:#fff;opacity:.92;transition:opacity .4s}
.sync.busy{background:#6b5a1e}.sync.ro{background:#6b2a1e}.sync.hide{opacity:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* programa París */
.pdays{display:grid;gap:14px;margin-top:12px}
.pfree{font:12.5px var(--f-mono);color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:7px 10px;background:color-mix(in srgb,var(--blue) 4%,var(--paper))}
.pday{border:1px solid var(--line);border-left:5px solid var(--red);border-radius:6px;background:var(--paper)}
.pdh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;background:none;padding:11px 10px;text-align:left;cursor:pointer}
.pdd{font:700 12.5px var(--f-mono);color:var(--red);white-space:nowrap}
.pdn{font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pday.open .pdn{white-space:normal}
.pdc{font:700 12px var(--f-mono);color:var(--muted)}
.pdb{padding:0 10px 10px;display:grid;gap:6px}
.pact{border-top:1px dashed var(--line)}
.pat{display:grid;grid-template-columns:24px 42px minmax(0,1fr) auto;gap:6px;align-items:center;width:100%;border:0;background:none;padding:9px 0;text-align:left;cursor:pointer}
.pn{width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font:700 11.5px var(--f-mono);display:grid;place-items:center}
.pt{font:13px var(--f-mono);color:var(--muted)}
.pnm{font:600 15px/1.25 var(--f-body);min-width:0}
.star{color:var(--red);font-size:12px}.pin{font-size:12px}
.pw{display:block;font:700 11.5px var(--f-mono);color:var(--red)}
.pp{font:700 12px var(--f-mono);background:var(--ink);color:var(--paper);padding:2px 6px;border-radius:3px;white-space:nowrap}
.pp.free{background:#e6dcc0;color:var(--ink)}
.pdet{padding:0 0 10px 30px;display:grid;gap:6px;font-size:14.5px}.pdet p{margin:0}
.plunch{border-left:5px solid #9a6a2f;border-radius:4px;padding:6px 10px;font-size:14px;background:repeating-linear-gradient(135deg,#efe2c8 0 7px,#f6ecd8 7px 14px)}
.pcat{display:grid;gap:4px;max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px;background:#fffef9}
.pci{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:7px 4px;border-bottom:1px dotted var(--line);font-size:14.5px;cursor:pointer}
.pci input{width:20px;height:20px;min-height:0;margin-top:2px}
/* día París estilo Alemania */
.pday2{border:1px solid var(--line);border-top:5px solid var(--red);border-radius:6px;background:var(--paper);padding:12px 14px 14px;display:grid;gap:10px;box-shadow:0 2px 0 rgba(0,0,0,.03),0 6px 14px rgba(40,25,10,.08)}
.pd-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pd-head h3{margin:2px 0 0;font:700 17px/1.25 var(--f-body);text-transform:none;letter-spacing:0;color:var(--ink)}
.pd-tot{text-align:right;display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.pd-tot b{font:700 20px var(--f-mono)}.pd-tot small{font:12px var(--f-mono);color:var(--muted)}
.pd-strip{display:flex;flex-wrap:wrap;gap:6px 14px;font:12.5px var(--f-mono);color:var(--muted);border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:6px 0}
.pd-strip b{color:var(--ink)}
.pd-body{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);grid-template-areas:"att com" "att tr" "att .";gap:12px 22px;align-items:start}
.pb-att{grid-area:att;display:grid;gap:4px;min-width:0}.pb-com{grid-area:com}.pb-tr{grid-area:tr}
.pblk{min-width:0;display:grid;gap:6px}
.pblk>h4{margin:0;font:600 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pb-com>h4,.pb-tr>h4{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:10px 0 6px;border-top:2px solid var(--ink);user-select:none}
.pb-com>h4::after,.pb-tr>h4::after{content:"▸ ver";font-weight:400;letter-spacing:0;text-transform:none}
.pb-com.open>h4::after,.pb-tr.open>h4::after{content:"▾ ocultar"}
.pb-com:not(.open)>:not(h4),.pb-tr:not(.open)>:not(h4){display:none!important}
.pmv{font:12px var(--f-mono);color:var(--muted);padding-left:30px}.pmv.m{color:var(--blue)}
.pdur{display:block;font:11.5px var(--f-mono);color:var(--muted);font-weight:400}
.route{display:block;margin:8px 0 2px;font:600 13px var(--f-mono)}
label.pchk{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer;padding:2px 0}
label.pchk input{width:18px;height:18px;min-height:0;margin-top:2px;accent-color:var(--red)}
label.pchk .t{flex:1;min-width:0}label.pchk .t small{display:block;color:var(--muted);font-size:12px}
.pchk .p,.pline .p{font:13px var(--f-mono);color:var(--muted);white-space:nowrap}
.pmsel{width:auto!important;max-width:calc(100% - 26px)!important;margin-left:26px;min-height:32px!important;padding:3px 6px!important;font-size:13px!important}
.pline{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:3px 0;border-bottom:1px dotted var(--line)}
.pline small{display:block;color:var(--muted);font:11.5px var(--f-mono)}.pline.tot{font-weight:700;border-bottom:0}
.pnote{font-size:12px;margin:2px 0}
.pmap{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:6px;margin-top:4px}
.pm-bg{fill:#f3ecdc}.pm-seine{fill:none;stroke:#9cc3d8;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.pm-l{stroke-width:2.2;stroke:var(--red)}.pm-l.w{stroke-dasharray:3 4;stroke:var(--ink);opacity:.7}.pm-l.m{stroke:var(--blue)}.pm-l.back{opacity:.35}
.pm-a circle{fill:var(--red);stroke:#fff;stroke-width:1.5}.pm-a text{fill:#fff;font:700 11px var(--f-mono);text-anchor:middle}
.pm-h rect{fill:var(--ink)}.pm-h text{fill:#fff;font:700 13px var(--f-body);text-anchor:middle}
.pm-sc line{stroke:var(--ink);stroke-width:2}.pm-sc text{font:10px var(--f-mono);fill:var(--muted);text-anchor:middle}
.pm-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font:11.5px var(--f-mono);color:var(--muted)}
.pm-leg i{display:inline-block;width:18px;height:0;border-top:2px dashed var(--ink);vertical-align:middle;margin-right:4px}.pm-leg i.m{border-top:2.5px solid var(--blue)}
@media (max-width:640px){.pd-body{display:flex;flex-direction:column;gap:10px}.pd-body>.pblk{width:100%}.pday2{padding:10px 10px 12px}.pd-head h3{font-size:15.5px}.pmv{padding-left:8px}}

.sunline{display:block;font:12px var(--f-mono);color:var(--muted);margin-top:3px}
.pact{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:6px}.pact>.pdet{grid-column:1/-1}
.pord{display:flex;flex-direction:column;gap:2px}.pord button{width:30px;height:24px;min-height:0;padding:0;border:1px solid var(--line);border-radius:4px;background:var(--paper);font:700 13px var(--f-mono);cursor:pointer;color:var(--ink)}.pord button:disabled{opacity:.3;cursor:default}
.riskbox{margin:8px 0;border-left:5px solid #b3261e;border-radius:4px;background:repeating-linear-gradient(135deg,color-mix(in srgb,#b3261e 9%,var(--paper)) 0 6px,color-mix(in srgb,#b3261e 4%,var(--paper)) 6px 12px);padding:6px 10px;font-size:13.5px}
.riskbox summary{cursor:pointer;font-weight:700;color:#8e1d14;list-style:none}.riskbox summary::-webkit-details-marker{display:none}
.riskbox summary::after{content:" ▸";font-weight:400}.riskbox[open] summary::after{content:" ▾"}.riskbox p{margin:6px 0 0}
.manord{font-size:13px;padding:6px 10px;border:1px dashed var(--line);border-radius:6px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}.manord button{font:600 12.5px var(--f-mono);border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:3px 8px;cursor:pointer}
.ctx p{max-width:72ch}.tlsvg{width:100%;height:auto;max-width:760px;display:block;margin:6px 0 4px;color:var(--ink)}
.fichas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:22px;margin-top:6px}
.ficha{position:relative;background:color-mix(in srgb,#d8b979 22%,var(--paper));color:var(--ink);border:1px solid color-mix(in srgb,#8a6b2f 45%,var(--line));border-radius:2px 10px 4px 4px;padding:30px 20px 18px;min-width:0;box-shadow:0 2px 0 color-mix(in srgb,#8a6b2f 30%,transparent);display:flex;flex-direction:column;gap:10px}
.ficha .ftab{position:absolute;top:-14px;left:16px;background:color-mix(in srgb,#d8b979 40%,var(--paper));border:1px solid color-mix(in srgb,#8a6b2f 45%,var(--line));border-bottom:0;border-radius:6px 6px 0 0;padding:3px 12px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;font-weight:700}
.ficha header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.ficha h3{font-size:23px;margin:0}.fy{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.fstamp{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.1em;color:#b0261c;border:2px solid currentColor;padding:1px 6px;transform:rotate(-3deg);display:inline-block}
.fstamp.ok{color:#2e7d32}
.flead{font-size:16.5px;font-style:italic;margin:0}
.flab{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px;border-bottom:1px dashed var(--line)}
.ficha p{margin:4px 0;font-size:15px;line-height:1.55}
.fnote{background:color-mix(in srgb,#fff59a 35%,transparent);padding:6px 10px;border-left:3px solid #d4b400}
.fphotos{display:flex;flex-wrap:wrap;gap:16px;padding-top:8px}
.polaroid{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:150px;padding:10px 10px 8px;background:#fdfbf4;color:#2a2620;border:1px solid #d9d2c0;box-shadow:0 2px 4px rgba(0,0,0,.18);text-decoration:none;transform:rotate(-1.5deg)}
.polaroid:nth-child(even){transform:rotate(1.6deg)}.polaroid:hover,.polaroid:focus-visible{transform:rotate(0) scale(1.03)}
.polaroid .ph{width:100%;height:76px;display:grid;place-items:center;font-size:30px;background:repeating-linear-gradient(45deg,#e7e1d0 0 6px,#efe9da 6px 12px)}
.polaroid .cap{font-size:13px;text-align:center;line-height:1.25;font-weight:600}.polaroid .go{font-size:11px;color:#6d6455;font-family:var(--f-mono)}
.polaroid .clip{position:absolute;top:-12px;left:18px;width:14px;height:34px;border:3px solid #8f969c;border-radius:8px;border-bottom-color:transparent}
.flinks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.ficha.flash{outline:3px solid var(--red);outline-offset:3px}
.brief{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.mitem{border:1px solid var(--line);padding:10px 12px;border-radius:4px;min-width:0}.mitem small{display:block;color:var(--muted);font-size:12.5px}.mitem p{margin:4px 0 0;font-size:14px}
.polaroid{width:190px}.polaroid img.ph{width:100%;height:120px;object-fit:cover;display:block;background:#ddd}.polaroid .ph{height:120px}.credit{font-size:11px;color:var(--muted);margin:2px 0 0}

const STEPS=[
 {t:"Vuelo de ida",s:"Santiago → Londres",f:[["ida_fecha","Fecha de salida","date"],["ida_vuelo","Aerolínea y número de vuelo","text","Ej.: LATAM LA704"],["ida_llega","Llegada a Londres (fecha)","date"],["ida_aerop","Aeropuerto de llegada","select",["Heathrow","Gatwick","Stansted","Otro"]]]},
 {t:"Londres",s:"Dos semanas con una amiga (previa al viaje)",f:[["lon_dir","Dónde se quedan en Londres (barrio o dirección)","text","Ej.: Camden"],["lon_notas","Notas (opcional)","textarea","Planes en Londres, contacto de la amiga…"]]},
 {t:"Londres → París",s:"Inicio oficial del viaje",f:[["eur_fecha","Fecha del tren a París","date"],["eur_hora","Hora de salida","time"],["eur_tren","Tren","text","Eurostar · St Pancras → Gare du Nord"]]},
 {t:"Base en París",s:"El punto de partida de todos los recorridos",f:[["par_dir","Dirección del alojamiento en París","text","Calle, número, barrio"],["par_tipo","Tipo de alojamiento","select",["Departamento","Hotel","Casa de amigos","Por definir"]]]},
 {t:"Regreso",s:"Salida de París",f:[["vue_fecha","Fecha del vuelo de regreso","date"],["vue_vuelo","Aerolínea y número de vuelo","text","Ej.: Air France AF406"],["vue_aerop","Aeropuerto","select",["Charles de Gaulle (CDG)","Orly (ORY)","Otro"]]]}];
function wizard(){const k=Math.min(ST.step||0,STEPS.length-1),S=STEPS[k],W=ST.wiz;
  return `<div class="sheet"><span class="eyebrow">Configuración · paso ${k+1} de ${STEPS.length}</span>
  <div class="steps">${STEPS.map((_,i)=>`<span class="${i<=k?"on":""}"></span>`).join("")}</div>
  <h2>${S.t}</h2><p class="muted" style="margin:0 0 12px">${S.s}</p>
  <form id="wf" class="stack">${S.f.map(([id,lab,ty,ex])=>`<label class="f">${lab}${ty==="select"?`<select name="${id}"><option value="">—</option>${ex.map(o=>`<option ${W[id]===o?"selected":""}>${o}</option>`).join("")}</select>`:ty==="textarea"?`<textarea name="${id}" placeholder="${esc(ex||"")}">${esc(W[id]||"")}</textarea>`:`<input type="${ty}" name="${id}" value="${esc(W[id]||"")}" placeholder="${esc(ex||"")}">`}</label>`).join("")}
  ${k===2&&W.eur_fecha&&W.vue_fecha?`<p class="note">En París: <b>${nights(W.eur_fecha,W.vue_fecha)} noches</b>, del ${pretty(W.eur_fecha)} al ${pretty(W.vue_fecha)}.</p>`:""}
  <div class="wnav"><button type="button" class="btn alt" id="wb" ${k===0?"disabled":""}>← Atrás</button><button type="submit" class="btn">${k===STEPS.length-1?"Terminar ✓":"Siguiente →"}</button></div></form>
  <p class="muted" style="font-size:13.5px;margin-top:12px">Puedes dejar campos en blanco y completarlos después en «Resumen».</p></div>`}
function bindWizard(){const f=$("#wf");if(!f)return;const keep=()=>{new FormData(f).forEach((v,k)=>ST.wiz[k]=String(v))};
  f.onsubmit=e=>{e.preventDefault();keep();if((ST.step||0)>=STEPS.length-1){ST.wiz.done=1;ST.step=STEPS.length;tab="escapadas"}else ST.step=(ST.step||0)+1;save();render();scrollTo(0,0)};
  $("#wb").onclick=()=>{keep();ST.step=Math.max(0,(ST.step||0)-1);save();render()}}

// ===== Resumen: línea de tiempo + calendario =====
function timeline(){const W=ST.wiz,it=[];
  if(W.ida_fecha)it.push([W.ida_fecha,"✈ Santiago → Londres",[W.ida_vuelo,W.ida_aerop&&"llega a "+W.ida_aerop].filter(Boolean).join(" · ")]);
  if(W.ida_llega)it.push([W.ida_llega,"🇬🇧 Londres con la amiga",[W.lon_dir,W.eur_fecha&&nights(W.ida_llega,W.eur_fecha)+" noches"].filter(Boolean).join(" · ")]);
  if(W.eur_fecha)it.push([W.eur_fecha,"🚄 Londres → París (inicio del viaje)",[W.eur_hora,W.eur_tren].filter(Boolean).join(" · ")]);
  [...ST.esc].sort((a,b)=>a.ini.localeCompare(b.ini)).forEach(e=>{const x=ESC.find(z=>z.id===e.id);if(!x)return;it.push([e.ini,`${x.p} ${x.n}`,e.fin===e.ini?"Excursión de un día":`${nights(e.ini,e.fin)} noche${nights(e.ini,e.fin)>1?"s":""} · vuelve ${pretty(e.fin)} · tren ${x.tr}`])});
  if(W.vue_fecha)it.push([W.vue_fecha,"✈ París → Santiago",[W.vue_vuelo,W.vue_aerop].filter(Boolean).join(" · ")]);
  it.sort((a,b)=>a[0].localeCompare(b[0]));
  return it.length?`<ol class="tl">${it.map(([d,t,s])=>`<li><span class="d">${pretty(d).replace(" ","<br>")}</span><span><b>${esc(t)}</b><small>${esc(s||"")}</small></span></li>`).join("")}</ol>`:`<div class="empty">Completa la configuración para ver la línea de tiempo.</div>`}
function calendar(){const W=ST.wiz;if(!W.eur_fecha||!W.vue_fecha)return"";
  const map={};ST.esc.forEach(e=>{const x=ESC.find(z=>z.id===e.id);if(!x)return;let d=e.ini;for(let i=0;i<=Math.max(0,nights(e.ini,e.fin));i++){map[d]=map[d]||[];map[d].push({x,first:d===e.ini,last:d===e.fin});d=add(d,1)}});
  let s=`<div class="cal">`,d=W.eur_fecha,m=-1;const first=D(d);const lead=(first.getDay()+6)%7;
  ["L","M","M","J","V","S","D"].forEach(h=>s+=`<span class="h">${h}</span>`);
  s+=`<span class="m">${MON[first.getMonth()]}</span>`;
  for(let i=0;i<lead;i++)s+=`<span></span>`;
  while(d<=W.vue_fecha){const dd=D(d);if(dd.getMonth()!==m&&d!==W.eur_fecha&&dd.getDate()===1){s+=`<span class="m">${MON[dd.getMonth()]}</span>`;for(let i=0;i<(dd.getDay()+6)%7;i++)s+=`<span></span>`}m=dd.getMonth();
    const E=map[d];const c=E?E[0].x.c:"";const tr=E&&(E[0].first||E[0].last);s+=`<span class="c ${E?"es":"pa"} ${tr?"tr":""}" style="${c?`--c:${c}`:""}" title="${pretty(d)}${E?" · "+E.map(z=>z.x.n).join(", "):" · París"}">${dd.getDate()}</span>`;d=add(d,1)}
  return s+`</div><div class="legend"><span><i style="background:color-mix(in srgb,#2e4f8f 16%,#fffdf6)"></i>París</span><span><i style="background:#a8352b"></i>Escapada</span><span><i style="outline:2px solid #a8352b;outline-offset:-2px;background:#fff"></i>Día de tren</span></div>`}
function resumen(){const W=ST.wiz,n=W.eur_fecha&&W.vue_fecha?nights(W.eur_fecha,W.vue_fecha):null,ne=ST.esc.reduce((t,e)=>t+Math.max(0,nights(e.ini,e.fin)),0);
  return `<div class="sheet panel"><span class="eyebrow">Resumen del viaje</span><h2>${n!=null?`${n} noches en Francia · ${n-ne} en París · ${ne} en escapadas`:"Viaje a París"}</h2>
  <h3>Calendario en Francia</h3>${calendar()||`<div class="empty">Indica la fecha del tren a París y la del vuelo de regreso.</div>`}
  <h3>Línea de tiempo</h3>${timeline()}
  <p style="margin-top:14px"><button class="btn alt sm" id="edit">✎ Editar vuelos, fechas y alojamiento</button></p></div>`}

// ===== Escapadas =====
function overlap(ini,fin,skip){return ST.esc.some(e=>e!==skip&&!(fin<e.ini||ini>e.fin))}
function escapadas(){const W=ST.wiz;const lim=W.eur_fecha&&W.vue_fecha;
  const list=ESC.filter(x=>filt==="todas"||(filt==="noche"&&x.k!=="dia")||(filt==="dia"&&x.k!=="noche")||(filt==="fuera"&&x.p!=="🇫🇷"));
  return `<div class="sheet panel"><span class="eyebrow">Escapadas desde París · máx. ~3 h en tren</span><h2>Elige a dónde ir</h2>
  <p class="muted" style="margin:0 0 10px">Cualquier día de la semana sirve. Toca un destino en el mapa o «Agregar» en las ideas.</p>
  ${frMap()}${escCard()}
  <h3>Elegidas (${ST.esc.length})</h3>
  ${ST.esc.length?`<div class="mine">${[...ST.esc].sort((a,b)=>a.ini.localeCompare(b.ini)).map(e=>{const x=ESC.find(z=>z.id===e.id);const n=nights(e.ini,e.fin);return `<div class="it" style="--c:${x.c}"><span>${x.p}</span><span><b>${x.n}</b><br><span class="dt">${pretty(e.ini)}${n?` → ${pretty(e.fin)} · ${n} noche${n>1?"s":""}`:" · ida y vuelta"}</span></span><button class="btn alt sm" data-del="${e.ini}|${e.id}" aria-label="Quitar ${x.n}">✕</button></div>`}).join("")}</div>`:`<div class="empty">Todavía no eligen escapadas.</div>`}
  <h3>Ideas</h3>
  <div class="filters">${[["todas","Todas"],["noche","Con noche"],["dia","De un día"],["fuera","Fuera de Francia"]].map(([k,t])=>`<button class="chip" data-f="${k}" aria-pressed="${filt===k}">${t}</button>`).join("")}</div>
  <div class="esc" style="margin-top:10px">${list.map(x=>{const sel=ST.esc.some(e=>e.id===x.id);return `<div class="card ${sel?"sel":""}" style="--c:${x.c}">
    <div class="top"><span class="flag">${x.p}</span><b>${x.n}</b></div>
    <div class="pills"><span class="pill train">🚄 ${x.tr}</span><span class="pill">${x.k==="dia"?"Excursión de un día":x.nt==="0–1"?"De un día o 1 noche":"Sugerido: "+x.nt+" noche"+(x.nt==="1"?"":"s")}</span></div>
    <p>${x.t}</p>
    ${open===x.id?planForm(x,lim):`<div class="act"><button class="btn sm" data-open="${x.id}">${sel?"+ Agregar otra fecha":"+ Agregar"}</button><button class="btn alt sm" data-efic="${x.id}">📖 Ficha</button>${sel?`<span class="muted" style="font-size:13px">✓ elegida</span>`:""}</div>`}</div>`}).join("")}</div></div>`}
function planForm(x,lim){const W=ST.wiz;const def=W.eur_fecha?add(W.eur_fecha,3):"";const n0=x.k==="dia"?0:parseInt(x.nt)||1;
  return `<form class="plan" data-plan="${x.id}"><div class="row2"><label class="f">Fecha de ida<input type="date" name="ini" value="${def}" ${lim?`min="${W.eur_fecha}" max="${W.vue_fecha}"`:""} required></label>
  <label class="f">Noches<select name="n">${[0,1,2,3,4].map(n=>`<option value="${n}" ${n===n0?"selected":""}>${n?n+" noche"+(n>1?"s":""):"Solo el día"}</option>`).join("")}</select></label></div>
  <p class="warn" id="pw-${x.id}"></p><div class="act"><button class="btn sm" type="submit">Guardar</button><button class="btn alt sm" type="button" data-close>Cancelar</button></div></form>`}

  const zl=Object.values(zones).sort((x,y)=>y.reduce((t,a)=>t+(a.top?2:0)+a.h,0)-x.reduce((t,a)=>t+(a.top?2:0)+a.h,0));

  const okDay=(p,a)=>!(a.cl&&a.cl.includes(D(p.d).getDay()));

  const step=ST.ritmo==="intenso"?1:2;let ix=plan.findIndex(p=>!p.first)+1;if(ix<1)ix=0;
  zl.forEach(z=>{let left=[...z];while(left.length){let tries=0,p=null;
      while(tries<plan.length){const c=plan[(ix+tries*1)%Math.max(1,plan.length)];if(c&&load(c)+left[0].h<=c.cap&&!c.acts.length&&okDay(c,left[0])){p=c;break}tries++}
      if(!p)p=plan.filter(c=>load(c)+left[0].h<=c.cap&&okDay(c,left[0])).sort((a,b)=>load(a)-load(b))[0];
      if(!p)break;while(left.length&&load(p)+left[0].h+0.3<=p.cap+0.01&&okDay(p,left[0]))p.acts.push(left.shift());
      ix=(plan.indexOf(p)+step)%Math.max(1,plan.length)}});
  plan.forEach(p=>{let pos=base,t=p.first||p.ret?14.5:9.5,rest=p.acts.filter(a=>!a.eve),seq=[];const eves=p.acts.filter(a=>a.eve);
    // abiertos: los que cierran antes van primero

      if(t>=12.5&&t<13.75&&!seq.lunch){seq.lunch=t;t+=1}seq.push({...a,st:t,late:a.close&&t+a.h>a.close+0.01,closed:a.cl&&a.cl.includes(D(p.d).getDay())});t+=a.h;pos=a.ll}

    p.seq=seq;p.end=t});
  return {plan,unpl:sel.filter(a=>!plan.some(p=>p.acts.includes(a)))}}

function sunOf(date,ll){const y=date.getFullYear(),n=Math.round((Date.UTC(y,date.getMonth(),date.getDate())-Date.UTC(y,0,0))/864e5),g=2*Math.PI/365*(n-1),
  eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g)),

  la=ll[0]*Math.PI/180,lsun=d=>{const n0=new Date(Date.UTC(y,d==="m"?2:9,31));return 31-n0.getUTCDay()},
  dst=(m=>m>2&&m<9||(m===2&&date.getDate()>=lsun("m"))||(m===9&&date.getDate()<lsun("o")))(date.getMonth())?2:1,

 panth:{y:"Terminado en 1790",h:["Luis XV lo mandó construir como iglesia de Santa Genoveva, pero se terminó con la Revolución, que lo convirtió en mausoleo de los grandes hombres de la patria.","En 1851 Léon Foucault colgó aquí su péndulo de 67 m para demostrar que la Tierra gira. En la cripta están Voltaire, Rousseau, Victor Hugo, Marie Curie y Joséphine Baker."],v:"El péndulo de Foucault oscilando bajo la cúpula y la cripta.",d:"Desde abril a octubre se puede subir a la columnata de la cúpula; en invierno no.",w:"Panteón de París",f:[["Péndulo de Foucault","Péndulo de Foucault"]]},

 opera:{y:"Inaugurada en 1875",h:["Charles Garnier ganó el concurso con solo 35 años. Durante la construcción encontraron agua subterránea y tuvieron que hacer un depósito bajo el edificio: de ahí nace la leyenda del lago del fantasma.","En 1896 se cayó un contrapeso de la gran lámpara y murió una persona: Gaston Leroux usó el hecho en «El fantasma de la ópera» (1910)."],v:"La gran escalera de mármol, el Gran Foyer dorado como Versalles y el techo de la sala pintado por Chagall en 1964.",d:"El palco 5 está reservado «al fantasma» y tiene una placa en la puerta.",w:"Ópera Garnier",f:[["La gran escalera","Ópera Garnier"],["Techo de Chagall","Ópera Garnier"]]},

 catac:{y:"Osario desde 1786",h:["Debajo de París hay cientos de kilómetros de antiguas canteras de donde salió la piedra de la ciudad. A fines del siglo XVIII los cementerios estaban colapsados y los huesos se trasladaron de noche a estos túneles.","Hoy hay restos de unos seis millones de personas, ordenados en paredes de cráneos y huesos largos. La entrada dice: «¡Alto! Aquí está el imperio de la muerte»."],v:"Un recorrido de 1,5 km a 20 m de profundidad entre paredes de huesos.",d:"Hace 14 °C todo el año. Son 131 escalones de bajada y 112 de subida; no hay baños.",w:"Catacumbas de París",f:[["Osario","Catacumbas de París"]]},

 marais:{y:"Place des Vosges, 1612",h:["Era un pantano («marais») que se drenó en la Edad Media. En el siglo XVII la nobleza construyó aquí sus mansiones; la Place des Vosges, inaugurada en 1612, es la plaza planificada más antigua de París.","Desde el siglo XIX es también el barrio judío (el «Pletzl»), con la rue des Rosiers como centro."],v:"La Place des Vosges con la casa de Victor Hugo, los patios de las mansiones, la rue des Rosiers.",d:"Abre los domingos, cuando casi todo París cierra.",w:"Le Marais",f:[["Place des Vosges","Plaza de los Vosgos"]]},
 picasso:{y:"Hôtel Salé, 1656 · museo desde 1985",h:["Al morir Picasso, sus herederos pagaron el impuesto a la herencia con obras de arte. Así el Estado formó esta colección, instalada en una mansión del siglo XVII."],v:"Más de 5.000 obras de todas sus épocas, desde el período azul al cubismo, con esculturas y cerámicas.",d:"El primer domingo del mes es gratis con reserva.",w:"Museo Picasso (París)",f:[["El edificio","Museo Picasso (París)"]]},

 seine:{y:"Barcos desde 1949",h:["Los «bateaux-mouches» toman su nombre de los astilleros de Lyon donde se fabricaban. El Sena y sus orillas en París son Patrimonio de la Humanidad desde 1991."],v:"De noche: Notre-Dame, el Louvre, los puentes iluminados y la Torre Eiffel centelleando.",d:"Sentarse en la cubierta abierta aunque haga frío: llevar gorro y guantes.",w:"Sena",f:[["El Sena de noche","Sena"]]},

 evol:{y:"Galería de 1889 · reabierta en 1994",h:["El Jardín de Plantas nació en 1635 como jardín de plantas medicinales del rey. La gran galería de hierro y vidrio se inauguró en 1889 y se renovó en 1994."],v:"El desfile de animales africanos, la ballena y la sala de especies extinguidas o amenazadas.",d:"Al lado está la casa de fieras, uno de los zoológicos más antiguos del mundo.",w:"Gran Galería de la Evolución",f:[["El desfile","Gran Galería de la Evolución"]]},

const wkCache={};
async function wkThumb(t){if(t in wkCache)return wkCache[t];wkCache[t]=null;
  try{const r=await fetch("https://es.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(t.replace(/ /g,"_")));if(r.ok){const j=await r.json();wkCache[t]=(j.thumbnail&&j.thumbnail.source)||null}}catch(e){}
  return wkCache[t]}
function hydratePhotos(){document.querySelectorAll("img[data-wk]:not([src])").forEach(async im=>{const u=await wkThumb(im.dataset.wk);if(u){im.src=u}else{const s=document.createElement("span");s.className="ph";s.textContent="📷";im.replaceWith(s)}})}

   ${x.f&&x.f.length?`<div class="fphotos">${x.f.filter((f,j,A)=>A.findIndex(g=>g[1]===f[1])===j).map(f=>`<a class="polaroid" href="${GIq(f[0]+" "+a.n.replace(/\s*\(.*?\)/,"")+" París")}" target="_blank" rel="noopener"><span class="clip" aria-hidden="true"></span><img class="ph" data-wk="${f[1]}" alt="${f[0]}" loading="lazy"><span class="cap">${f[0]}</span><span class="go">más fotos →</span></a>`).join("")}</div><p class="credit">Fotos: Wikipedia / Wikimedia Commons · ${[...new Set(x.f.map(f=>f[1]))].map(t=>`<a href="${WKq(t)}" target="_blank" rel="noopener">${t}</a>`).join(" · ")}</p>`:""}

  </article>`}

function atracciones(){const fl=[["todas","Todas"],["prog","En el programa"],["top","★ Imperdibles"],["in","🏛 Techadas"]];
  const L=PA.filter(a=>PA_F[a.id]).filter(a=>attFilt==="todas"||(attFilt==="prog"&&paSel(a))||(attFilt==="top"&&a.top)||(attFilt==="in"&&a.in));

  const rest=PA.filter(a=>!PA_F[a.id]);
  return `<div class="sheet panel"><section class="ctx card"><span class="eyebrow">Contexto histórico</span><h2>${CTX_PA.t}</h2>${tlSVG(CTX_PA.tl)}${CTX_PA.p.map(p=>`<p>${p}</p>`).join("")}</section>
   <div class="filters" style="margin:16px 0 22px">${fl.map(([k,t])=>`<button class="chip" data-attf="${k}" aria-pressed="${attFilt===k}">${t}</button>`).join("")}</div>
   <div class="fichas">${L.map(a=>paFicha(a,PA.indexOf(a))).join("")}</div>
   ${rest.length?`<div class="card" style="margin-top:22px"><span class="eyebrow">Otras, en breve</span><ul class="brief">${rest.map(a=>`<li><b>${a.n}</b>: ${a.s} ${a.d}</li>`).join("")}</ul></div>`:""}

  const L=[{k:"par",n:"París",p:"🇫🇷",ini:W.eur_fecha,fin:W.vue_fecha,nn:nights(W.eur_fecha,W.vue_fecha)-escN,city:"Paris"}];
  ST.esc.filter(e=>nights(e.ini,e.fin)>0).sort((a,b)=>a.ini<b.ini?-1:1).forEach(e=>{const x=ESC.find(q=>q.id===e.id)||{n:e.id,p:""};L.push({k:"esc-"+e.id+"-"+e.ini,n:x.n,p:x.p,ini:e.ini,fin:e.fin,nn:nights(e.ini,e.fin),city:x.n})});
  return L}

function bindHot(){document.querySelectorAll("[data-htab]").forEach(x=>x.onclick=()=>{hotTab=x.dataset.htab;render()});

// ===== Día de París con la lógica de Alemania: atracciones + anexo Comidas + Traslados y plano =====
const PA_MEAL_LBL={d:"Desayuno",a:"Almuerzo",m:"Media tarde",c:"Cena"};
// precios aproximados por persona (París 2026, verificar)
const PA_MEAL={d:[["Café + croissant en boulangerie",6],["Desayuno en café",12]],
  a:[["Formule de bistró (plato + postre)",18],["Crêpe o sándwich al paso",9],["Brasserie",28]],
  m:[["Pastelería / macarons",6],["Chocolate caliente en café",8]],
  c:[["Bistró de barrio",28],["Algo al paso / supermercado",12],["Restaurante especial",50]]};
const PA_MEAL_DEF={d:true,a:true,m:false,c:true};
const METRO=2.55;// boleto metro/RER (RATP 2026)
let paBlk=new Set();
const mealOnP=(d,k)=>{const m=ST.meals||{};return (d+"|"+k) in m?!!m[d+"|"+k]:PA_MEAL_DEF[k]};
const mealIxP=(d,k)=>{const i=(ST.mealOpt||{})[d+"|"+k]|0;return Math.min(i,PA_MEAL[k].length-1)};
function legsOfDay(p){const base=BASES[ST.base]||BASES["Otro / centro"];const L=[];let pos=base,nm="alojamiento";
  p.seq.forEach((a,k)=>{L.push({from:pos,to:a.ll,fn:nm,tn:a.n.replace(/\s*\(.*?\)/,""),k:k+1});pos=a.ll;nm=a.n.replace(/\s*\(.*?\)/,"")});
  if(p.seq.length)L.push({from:pos,to:base,fn:nm,tn:"alojamiento",k:0});
  return L.map(l=>{const d=km(l.from,l.to);return {...l,d,metro:d>1.2,min:Math.max(5,Math.round(mv(l.from,l.to)*60/5)*5)}})}
const trUrl=(a,b,m)=>`https://www.google.com/maps/dir/?api=1&origin=${a.join(",")}&destination=${b.join(",")}&travelmode=${m?"transit":"walking"}`;
// Sena aproximada (lat,lng) de este a oeste
const SEINE=[[48.8255,2.4100],[48.8300,2.3880],[48.8360,2.3760],[48.8430,2.3650],[48.8490,2.3600],[48.8515,2.3540],[48.8545,2.3480],[48.8575,2.3410],[48.8590,2.3350],[48.8615,2.3270],[48.8640,2.3200],[48.8645,2.3080],[48.8635,2.3010],[48.8605,2.2935],[48.8560,2.2870],[48.8495,2.2790],[48.8440,2.2740],[48.8380,2.2690],[48.8300,2.2630]];
function dayMap(p,legs){const base=BASES[ST.base]||BASES["Otro / centro"];const pts=[base,...p.seq.map(a=>a.ll)];
  let la0=Math.min(...pts.map(x=>x[0])),la1=Math.max(...pts.map(x=>x[0])),lo0=Math.min(...pts.map(x=>x[1])),lo1=Math.max(...pts.map(x=>x[1]));
  const kx=Math.cos(48.86*Math.PI/180);let w=(lo1-lo0)*kx,h=la1-la0;const mn=0.012;
  if(w<mn){const c=(lo0+lo1)/2;lo0=c-mn/kx/2;lo1=c+mn/kx/2;w=mn}if(h<mn){const c=(la0+la1)/2;la0=c-mn/2;la1=c+mn/2;h=mn}
  const pad=0.18;const W=300,Hh=Math.round(Math.max(150,Math.min(260,W*(h/w))));const sx=W/(w*(1+2*pad)),sy=Hh/(h*(1+2*pad));const s=Math.min(sx,sy);
  const cx=(lo0+lo1)/2,cy=(la0+la1)/2;const P=ll=>[(W/2+(ll[1]-cx)*kx*s).toFixed(1),(Hh/2-(ll[0]-cy)*s).toFixed(1)];
  const seine=SEINE.map(P).map(q=>q.join(",")).join(" ");
  let g=`<polyline points="${seine}" class="pm-seine"/>`;
  legs.forEach(l=>{const a=P(l.from),b=P(l.to);g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="pm-l ${l.metro?"m":"w"}${l.k?"":" back"}"/>`});
  const hb=P(base);g+=`<g class="pm-h" transform="translate(${hb[0]},${hb[1]})"><rect x="-8" y="-8" width="16" height="16" rx="3"/><text y="4.5">⌂</text></g>`;
  p.seq.forEach((a,k)=>{const q=P(a.ll);g+=`<g class="pm-a" transform="translate(${q[0]},${q[1]})"><circle r="9"/><text y="4">${k+1}</text></g>`});
  // escala 1 km
  const km1=s/111;g+=`<g class="pm-sc" transform="translate(10,${Hh-10})"><line x1="0" y1="0" x2="${(km1).toFixed(1)}" y2="0"/><text x="${(km1/2).toFixed(1)}" y="-4">1 km</text></g>`;
  return `<svg class="pmap" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Plano del día"><rect width="${W}" height="${Hh}" class="pm-bg"/>${g}</svg>
  <div class="pm-leg"><span><i class="w"></i>a pie</span><span><i class="m"></i>metro/RER</span><span>⌂ alojamiento</span><span class="muted">Sena aprox.</span></div>`}
function dayCost(p){const ent=p.seq.reduce((t,a)=>t+a.p,0);let meal=0;["d","a","m","c"].forEach(k=>{if(mealOnP(p.d,k))meal+=PA_MEAL[k][mealIxP(p.d,k)][1]});
  const legs=legsOfDay(p);const nm=legs.filter(l=>l.metro).length;const hot=hotNightPP("par");return {ent,meal,hot,tr:nm*METRO,nm,legs,total:ent+meal+hot+nm*METRO}}
function dayCard(p,days){const c=dayCost(p);const SUN=sunOf(D(p.d),PARIS);const nonEve=p.seq.filter(a=>!a.eve);const legs=c.legs;const id=p.d;const oc=paBlk.has(id+"|com"),ot=paBlk.has(id+"|tr");
  const title=p.seq.map(a=>a.n.replace(/\s*\(.*?\)/,"")).join(" · ");
  let h=`<article class="pday2" data-day="${id}"><div class="pd-head"><div><span class="eyebrow">${pretty(p.d)} · París</span><h3>${title}</h3>${(()=>{const S=sunOf(D(p.d),PARIS);return `<span class="sunline">🌇 Se pone el sol ${hm(S.set)} · 🌙 oscuro desde ${hm(S.dusk)}</span>`})()}</div>
    <div class="pd-tot"><span class="eyebrow">Por persona</span><b>${fmtE(c.total)}</b><small>los 2: ${fmtE(c.total*2)}</small></div></div>
    <div class="pd-strip"><span>🎟️ Entradas <b>${fmtE(c.ent)}</b></span><span>🍽️ Comidas <b>${fmtE(c.meal)}</b></span><span>🚇 Transporte <b>${fmtE(c.tr)}</b></span><span>🛏️ Alojamiento <b>${c.hot?fmtE(c.hot):"—"}</b></span></div>
    <div class="pd-body"><div class="pblk pb-att"><h4>Atracciones</h4>
    ${p.first?`<p class="note">Llegada en Eurostar: la tarde queda libre para panoramas cerca.</p>`:p.ret?`<p class="note">Vuelta de escapada: solo la tarde.</p>`:""}`;
  let lp=false;const lunch=()=>`<div class="plunch">🍽 <b>${hm(p.seq.lunch)}</b> Almuerzo con calma (~1 h)</div>`;
  p.seq.forEach((a,k)=>{const l=legs[k];
    if(p.seq.lunch&&!lp&&a.st>p.seq.lunch){h+=lunch();lp=true}
    h+=`<span class="pmv ${l.metro?"m":""}">↓ ${l.metro?`~${l.min} min en metro/RER`:`a pie ~${l.min} min`}${k===0?" desde el alojamiento":""} · <a href="${trUrl(l.from,l.to,l.metro)}" target="_blank" rel="noopener">cómo llegar</a></span>`;
    const op=paOpen.has(p.d+"|"+a.id);
    h+=`<div class="pact${op?" open":""}">
        <button class="pat" data-pact="${p.d}|${a.id}"><span class="pn">${k+1}</span><span class="pt">${hm(a.st)}</span><span class="pnm">${a.n}${a.top?' <span class="star">★</span>':""}${a.in?' <span class="pin">🏛</span>':""}${a.closed?' <span class="pw">⚠ cerrado ese día</span>':a.late?` <span class="pw">⚠ cierra ${hm(a.close)}</span>`:""}<small class="pdur">🕐 ~${String(a.h).replace(".",",")} h${!a.in?(a.st>=SUN.dusk-0.05?' · <span title="Ya es de noche">🌙 de noche</span>':a.st+a.h>SUN.set+0.15?' · <span title="Termina con poca luz">🌇 con poca luz</span>':""):""}</small></span><span class="pp ${a.p?"":"free"}">${fmtE(a.p)}</span></button>
        ${!a.eve&&nonEve.length>1?`<span class="pord"><button type="button" data-pmv="${p.d}|${a.id}|-1" aria-label="Subir" ${nonEve[0].id===a.id?"disabled":""}>↑</button><button type="button" data-pmv="${p.d}|${a.id}|1" aria-label="Bajar" ${nonEve[nonEve.length-1].id===a.id?"disabled":""}>↓</button></span>`:""}
        ${op?`<div class="pdet"><p><b>${a.s}</b></p><p><b>Qué ver:</b> ${a.v}</p><p><b>Consejo:</b> ${a.d}</p>
          <p class="muted">🕐 visita ~${String(a.h).replace(".",",")} h${a.close?` · cierra ${hm(a.close)} (invierno)`:""}${a.cl?` · cerrado ${a.cl.map(x=>DOW[x]).join(", ")}`:""}</p>
          <div class="act"><a class="btn alt sm" href="${a.u}" target="_blank" rel="noopener">Sitio</a><a class="btn alt sm" href="https://www.google.com/maps/search/?api=1&query=${a.ll.join(",")}" target="_blank" rel="noopener">Mapa</a>
          <select data-papin="${a.id}" aria-label="Elegir día" style="width:auto;min-height:34px;padding:4px 8px;font-size:14px"><option value="">📅 Día automático</option>${days.map(x=>`<option value="${x.d}" ${(ST.paPin||{})[a.id]===x.d?"selected":""}>${pretty(x.d)}</option>`).join("")}</select>
          <button class="btn alt sm" data-paoff="${a.id}">✕ Quitar</button></div></div>`:""}</div>`});
  if(p.seq.lunch&&!lp)h+=lunch();
  const back=legs[legs.length-1];
  h+=`<span class="pmv ${back.metro?"m":""}">↓ vuelta al alojamiento ${back.metro?`~${back.min} min en metro/RER`:`a pie ~${back.min} min`} · llegada ~${hm(p.end+mv(back.from,back.to))}</span>
    ${(()=>{const zs=zonesNearPA([BASES[ST.base]||BASES["Otro / centro"],...p.seq.map(a=>a.ll)]);return zs.length?`<details class="riskbox"><summary>⚠ Zona${zs.length>1?"s":""} de precaución: ${zs.map(z=>z.n).join(" · ")}</summary>${zs.map(z=>`<p><b>${z.n}:</b> ${z.t}</p>`).join("")}<p class="muted">Emergencias: <b>112</b> · Policía: <b>17</b> · Ambulancia (SAMU): <b>15</b></p></details>`:""})()}
    ${p.man?`<div class="manord">✋ <b>Orden manual</b>${p.seq.some(a=>a.late||a.closed)?" · ⚠ algo queda fuera de horario":""}<button type="button" data-pmreset="${p.d}">↺ Orden automático</button></div>`:""}
    <a class="route" href="${routeUrl(p)}" target="_blank" rel="noopener">🗺 Ver recorrido del día en Google Maps (A = alojamiento, luego ${p.seq.map((_,k)=>k+1).join("→")})</a></div>`;
  // Comidas
  h+=`<div class="pblk pb-com${oc?" open":""}"><h4 data-pblk="${id}|com"><span>Comidas · ${fmtE(c.meal)}</span></h4>`;
  ["d","a","m","c"].forEach(k=>{const on=mealOnP(p.d,k),i=mealIxP(p.d,k),o=PA_MEAL[k];
    h+=`<label class="pchk"><input type="checkbox" data-pmeal="${p.d}|${k}" ${on?"checked":""}><span class="t">${PA_MEAL_LBL[k]}<small>${o[i][0]}</small></span><span class="p">${fmtE(o[i][1])}</span></label>
    ${o.length>1?`<select class="pmsel" data-pmopt="${p.d}|${k}" aria-label="Opción ${PA_MEAL_LBL[k]}">${o.map((x,j)=>`<option value="${j}" ${j===i?"selected":""}>${x[0]} · ${fmtE(x[1])}</option>`).join("")}</select>`:""}`});
  h+=`<p class="muted pnote">Precios aproximados por persona: verificar en el lugar.</p></div>`;
  // Traslados y plano
  h+=`<div class="pblk pb-tr${ot?" open":""}"><h4 data-pblk="${id}|tr"><span>Traslados y plano · ${fmtE(c.tr)}</span></h4>
    ${legs.map(l=>`<div class="pline"><span>${l.metro?"🚇":"🚶"} ${l.fn} → ${l.tn}<small>${l.d.toFixed(1).replace(".",",")} km · ~${l.min} min · <a href="${trUrl(l.from,l.to,l.metro)}" target="_blank" rel="noopener">ruta</a></small></span><span class="p">${l.metro?fmtE(METRO):"—"}</span></div>`).join("")}
    <div class="pline tot"><span>${c.nm} ${c.nm===1?"viaje":"viajes"} en metro/RER × ~${fmtE(METRO)}</span><span class="p">${fmtE(c.tr)}</span></div>
    <p class="muted pnote">Boleto único metro/RER/bus en la app Bonjour RATP o tarjeta Navigo Easy. Si hay muchos días seguidos, conviene el pase Navigo semanal (lunes a domingo).</p>
    ${dayMap(p,legs)}</div>`;
  return h+`</div></article>`}

let paOpen=new Set(),paCat=false,paFilt="todas";
function paris(){const days=parisDays();
  if(!days.length)return `<div class="sheet panel"><span class="eyebrow">Programa en París</span><h2>Días en París</h2><div class="empty">Completa las fechas del tren a París y del vuelo de regreso para armar los días.</div></div>`;
  const R=buildPA();const used=R.plan.filter(p=>p.seq.length).length;
  let h=`<div class="sheet panel"><span class="eyebrow">Programa en París</span><h2>${days.length} días en París · ${used} con panorama</h2>
  <div class="row2"><label class="f">Barrio del alojamiento<select id="paBase">${Object.keys(BASES).map(k=>`<option ${(ST.base||"Otro / centro")===k?"selected":""}>${k}</option>`).join("")}</select></label>
  <label class="f">Ritmo<select id="paRitmo"><option value="tranquilo" ${ST.ritmo!=="intenso"?"selected":""}>Tranquilo · día libre entre medio</option><option value="intenso" ${ST.ritmo==="intenso"?"selected":""}>Intenso · todos los días</option></select></label></div>
  <p style="margin:12px 0 4px"><button class="btn alt sm" id="paCatBtn">${paCat?"▾ Ocultar atracciones":"▸ Elegir atracciones"} (${PA.filter(paSel).length} de ${PA.length})</button></p>
  ${paCat?catalog():""}
  ${R.unpl.length?`<p class="warn">No caben ${R.unpl.length}: ${R.unpl.map(a=>a.n).join(", ")}. Cambia a ritmo intenso o quita otras.</p>`:""}
  <div class="pdays">`;
  let free=[];const flush=()=>{if(!free.length)return;h+=`<div class="pfree">${free.length===1?"Día libre":free.length+" días libres"}: ${free.map(x=>pretty(x.d)).join(" · ")}</div>`;free=[]};
  R.plan.forEach(p=>{if(!p.seq.length){free.push(p);return}flush();h+=dayCard(p,days)});
  flush();
  return h+`</div><p class="muted" style="font-size:13px;margin-top:12px">Precios de adulto no residente en la UE, temporada 2026: verificar al comprar. Horarios de cierre de invierno.</p></div>`}
function catalog(){const fl=[["todas","Todas"],["top","★ Imperdibles"],["in","🏛 Techadas"],["free","Gratis"],["xmas","🎄 Navidad"]];
  const L=PA.filter(a=>paFilt==="todas"||(paFilt==="top"&&a.top)||(paFilt==="in"&&a.in)||(paFilt==="free"&&!a.p)||(paFilt==="xmas"&&a.xmas));
  return `<div class="filters" style="margin:8px 0">${fl.map(([k,t])=>`<button class="chip" data-paf="${k}" aria-pressed="${paFilt===k}">${t}</button>`).join("")}</div>
  <div class="pcat">${L.map(a=>`<label class="pci"><input type="checkbox" data-pasel="${a.id}" ${paSel(a)?"checked":""}><span><b>${a.n}</b>${a.top?' <span class="star">★</span>':""}<br><small class="muted">${a.z} · ~${String(a.h).replace(".",",")} h · ${fmtE(a.p)}${a.in?" · 🏛":""}${a.xmas?" · 🎄":""}</small></span></label>`).join("")}</div>`}
function bindParis(){const b=$("#paBase");if(!b)return;
  b.onchange=()=>{ST.base=b.value;save();render()};$("#paRitmo").onchange=e=>{ST.ritmo=e.target.value;save();render()};
  $("#paCatBtn").onclick=()=>{paCat=!paCat;render()};
  document.querySelectorAll("[data-paf]").forEach(x=>x.onclick=()=>{paFilt=x.dataset.paf;render()});
  document.querySelectorAll("[data-pasel]").forEach(x=>x.onchange=()=>{ST.paSel=ST.paSel||{};ST.paSel[x.dataset.pasel]=x.checked;save();render()});
  document.querySelectorAll("[data-pblk]").forEach(x=>x.onclick=()=>{const k=x.dataset.pblk;paBlk.has(k)?paBlk.delete(k):paBlk.add(k);x.parentNode.classList.toggle("open")});
  document.querySelectorAll("[data-pmv]").forEach(x=>x.onclick=e=>{e.stopPropagation();const [d,id,dir]=x.dataset.pmv.split("|");const R=buildPA();const pl=R.plan.find(q=>q.d===d);if(!pl)return;const ids=pl.seq.filter(a=>!a.eve).map(a=>a.id);const i=ids.indexOf(id),j=i+(+dir);if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];ST.paOrd=ST.paOrd||{};ST.paOrd[d]=ids;save();render()});
  document.querySelectorAll("[data-pmreset]").forEach(x=>x.onclick=()=>{ST.paOrd=ST.paOrd||{};delete ST.paOrd[x.dataset.pmreset];save();render()});
  document.querySelectorAll("[data-pmeal]").forEach(x=>x.onchange=()=>{ST.meals=ST.meals||{};ST.meals[x.dataset.pmeal]=x.checked;save();render()});
  document.querySelectorAll("[data-pmopt]").forEach(x=>x.onchange=()=>{ST.mealOpt=ST.mealOpt||{};ST.mealOpt[x.dataset.pmopt]=+x.value;save();render()});
  document.querySelectorAll("[data-pact]").forEach(x=>x.onclick=()=>{const k=x.dataset.pact;paOpen.has(k)?paOpen.delete(k):paOpen.add(k);render()});

function frMap(){const M=FRMAP;const pr=ll=>[(ll[1]-M.W)*M.kx*M.sc,(M.N-ll[0])*M.sc];
  const p0=pr(PARIS);const day=ESC.filter(x=>x.k==="dia"),far=ESC.filter(x=>x.k!=="dia");const chosen=new Set(ST.esc.map(e=>e.id));
  let s=`<svg class="frmap" viewBox="${M.vb.join(" ")}" role="img" aria-label="Mapa de escapadas desde París"><rect width="${M.vb[2]}" height="${M.vb[3]}" class="fm-sea"/>`;
  Object.entries(M.c).forEach(([k,d])=>s+=`<path d="${d}" class="fm-c ${k==="FRA"?"fr":""}"/>`);
  far.forEach(x=>{const q=pr(EXT[x.id].ll);s+=`<path class="fm-l ${x.k==="ambos"?"amb":"far"}${chosen.has(x.id)?" on":""}" d="M${p0[0].toFixed(1)},${p0[1].toFixed(1)}L${q[0].toFixed(1)},${q[1].toFixed(1)}" style="--c:${x.c}"/>`});
  far.forEach(x=>{const q=pr(EXT[x.id].ll);const lab=x.n.split(/ y |:/)[0];let left=q[0]<p0[0]-20,below=false;if(left&&q[0]<lab.length*6.7+14)below=true;if(q[0]>M.vb[2]-lab.length*6.7-14)left=true;
    const tx=below?q[0]:q[0]+(left?-11:11),ty=below?q[1]+20:q[1]+4,ta=below?"middle":left?"end":"start";
    s+=`<g class="fm-pt${chosen.has(x.id)?" on":""}${escPick===x.id?" pick":""}" data-esc="${x.id}" role="button" tabindex="0" aria-label="${x.n}" style="--c:${x.c}"><circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${x.k==="ambos"?6:8}"/><text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${ta}">${lab}</text></g>`});
  s+=`<g class="fm-paris"><circle cx="${p0[0].toFixed(1)}" cy="${p0[1].toFixed(1)}" r="11"/><text x="${p0[0].toFixed(1)}" y="${(p0[1]+4).toFixed(1)}" text-anchor="middle">★</text><text class="fm-pl" x="${(p0[0]-13).toFixed(1)}" y="${(p0[1]+20).toFixed(1)}" text-anchor="end">PARÍS</text></g>`;
  // recuadro: alrededores de París (excursiones de un día)
  const ix=8,iy=8,iw=150,ih=142,zc=[48.85,2.32],zs=5.2;const zp=ll=>[ix+iw/2+(ll[1]-zc[1])*M.kx*M.sc*zs/ (M.sc/40)/1,iy+ih/2-(ll[0]-zc[0])*M.sc*zs/(M.sc/40)/1];
  const zsc=ll=>{const dx=(ll[1]-zc[1])*M.kx*40*zs/ (1),dy=(ll[0]-zc[0])*40*zs;return [ix+iw/2+dx*0.42,iy+ih/2-dy*0.42]};
  s+=`<g class="fm-inset"><rect x="${ix}" y="${iy}" width="${iw}" height="${ih}" rx="6"/><text class="fm-it" x="${ix+8}" y="${iy+15}">Alrededores · de un día</text>`;
  const pc=zsc(PARIS);s+=`<circle class="fm-ipc" cx="${pc[0].toFixed(1)}" cy="${pc[1].toFixed(1)}" r="7"/><text class="fm-ipt" x="${pc[0].toFixed(1)}" y="${(pc[1]+3.5).toFixed(1)}" text-anchor="middle">★</text>`;
  day.forEach(x=>{const q=zsc(EXT[x.id].ll);s+=`<path class="fm-l day${chosen.has(x.id)?" on":""}" d="M${pc[0].toFixed(1)},${pc[1].toFixed(1)}L${q[0].toFixed(1)},${q[1].toFixed(1)}" style="--c:${x.c}"/><g class="fm-pt day${chosen.has(x.id)?" on":""}${escPick===x.id?" pick":""}" data-esc="${x.id}" role="button" tabindex="0" aria-label="${x.n}" style="--c:${x.c}"><circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="5.5"/>${(()=>{const L=pc[0]-q[0]>4&&pc[0]-q[0]<35;return `<text x="${(q[0]+(L?-8:8)).toFixed(1)}" y="${(q[1]+3.5).toFixed(1)}" text-anchor="${L?"end":"start"}">${x.n}</text>`})()}</g>`});
  s+=`</g></svg>`;
  return `<div class="fmwrap">${s}<div class="fm-leg"><span><i class="lg far"></i>2–3 h · con 1–3 noches</span><span><i class="lg amb"></i>1–2 h · día o 1 noche</span><span><i class="lg day"></i>Excursión de un día</span><span><b>●</b> elegida</span></div></div>`}

function escCard(){if(!escPick)return `<p class="muted" style="font-size:14px;margin:8px 0 0">Toca un destino en el mapa para ver cómo llegar, cuánto cuesta y su ficha.</p>`;
  const x=ESC.find(z=>z.id===escPick),e=EXT[x.id];const sel=ST.esc.filter(z=>z.id===x.id);
  return `<div class="ecard" style="--c:${x.c}"><div class="top"><span class="flag">${x.p}</span><b>${x.n}</b><button class="btn alt sm ecx" data-epick="" aria-label="Cerrar">✕</button></div>
   <p>${x.t}</p>
   <dl class="edl"><dt>🚄 Viaje</dt><dd>${x.tr}</dd><dt>🛤 Cómo</dt><dd>${e.how}</dd><dt>💶 Costo</dt><dd>${e.cost}</dd><dt>🛏 Noches</dt><dd>${x.k==="dia"?"Excursión de un día":x.nt==="0–1"?"De un día o 1 noche":x.nt+" noche"+(x.nt==="1"?"":"s")+" sugeridas"}</dd></dl>
   ${sel.length?`<p class="okl">✓ Elegida: ${sel.map(z=>pretty(z.ini)+(z.fin!==z.ini?" → "+pretty(z.fin):"")).join(" · ")}</p>`:""}
   <div class="act"><button class="btn sm" data-efic="${x.id}">📖 Ver ficha</button><button class="btn alt sm" data-open="${x.id}" data-goto="1">+ Agregar fechas</button></div></div>`}
function fichaEsc(){if(!escFicha)return"";const x=ESC.find(z=>z.id===escFicha),e=EXT[x.id],f=e.f;
  return `<div class="fov" data-fclose="1"><article class="fsheet" style="--c:${x.c}" role="dialog" aria-label="Ficha ${x.n}"><button class="btn alt sm fx" data-fclose="1" aria-label="Cerrar">✕</button>
   <span class="eyebrow">${x.p} Escapada desde París · ${x.k==="dia"?"de un día":"con noche"}</span><h2>${x.n}</h2>
   <div class="pills"><span class="pill train">🚄 ${x.tr}</span><span class="pill">💶 ${e.cost}</span></div>
   <h3>Por qué vale la pena</h3><p>${f.h}</p>
   <h3>Qué ver</h3><ul>${f.v.map(v=>`<li>${v}</li>`).join("")}</ul>
   <h3>Cómo llegar</h3><p>${e.how}</p>
   <h3>Qué probar</h3><p>${f.c}</p>
   <h3>Consejo</h3><p>${f.d}</p>
   <div class="act" style="margin-top:12px"><a class="btn alt sm" href="https://www.google.com/maps/search/?api=1&query=${e.ll.join(",")}" target="_blank" rel="noopener">🗺 Mapa</a><a class="btn alt sm" href="https://www.sncf-connect.com/" target="_blank" rel="noopener">🎫 Ver trenes (SNCF Connect)</a><a class="btn alt sm" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(x.n)}" target="_blank" rel="noopener">📷 Fotos</a></div>
   <p class="muted" style="font-size:12.5px;margin-top:10px">Costos de tren aproximados de ida en 2.ª clase comprando con anticipación; verificar al comprar.</p></article></div>`}
function bindEsc(){document.querySelectorAll("[data-esc]").forEach(g=>{const f=()=>{escPick=g.dataset.esc;render();const c=$(".ecard");if(c)c.scrollIntoView({block:"nearest",behavior:"smooth"})};g.onclick=f;g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
  document.querySelectorAll("[data-epick]").forEach(b=>b.onclick=()=>{escPick=null;render()});
  document.querySelectorAll("[data-efic]").forEach(b=>b.onclick=()=>{escFicha=b.dataset.efic;render()});
  document.querySelectorAll("[data-fclose]").forEach(b=>b.onclick=e=>{if(e.target===b||b.classList.contains("fx")){escFicha=null;render()}});
  document.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>setTimeout(()=>{const f=document.querySelector(`form[data-plan="${b.dataset.open}"]`);if(f)f.scrollIntoView({block:"center",behavior:"smooth"})},50)))}

// ===== Render =====
function render(){if(!user)return;
  const W=ST.wiz;const conf=W.done;
  const tabs=[["resumen","Resumen","#2e4f8f"],["paris","París","#a8352b"],["escapadas","Escapadas","#2f6b4f"],["att","Atracciones","#8a6b2f"],["hot","Alojamiento","#6b4f8f"],["tk","Pasajes","#2b2622"],["tips","Consejos","#b8860b"],["show","Espectáculos","#c0392b"]];
  if(!conf&&tab!=="config")tab="config";
  app.innerHTML=`<div class="hdr"><img src="img/logo-marcopolo.jpg" alt=""><div><span class="eyebrow">Marco Polo</span><h1>Viaje a París</h1></div>
   <div class="who">${esc(user.displayName||user.email)}<br>${DEMO?"":`<button id="so">Salir</button> · `}<a href="/">Viajes</a></div></div>
   ${tab==="config"?wizard():`<div class="tabs" role="tablist">${tabs.map(([k,t,c])=>`<button class="tab" role="tab" style="--c:${c}" data-tab="${k}" aria-selected="${tab===k}">${t}</button>`).join("")}</div>
   ${tab==="resumen"?resumen():tab==="paris"?paris():tab==="att"?atracciones():tab==="hot"?alojamiento():tab==="tk"?pasajes():tab==="tips"?consejos():tab==="show"?espectaculos():escapadas()}`}${fichaEsc()}`;
  bindWizard();bindParis();bindEsc();if(tab==="att")bindAtt();if(tab==="hot")bindHot();if(tab==="tk")bindTk();if(tab==="tips")bindTips();if(tab==="show")bindShows();
  const so=$("#so");if(so)so.onclick=()=>window._auth.U.signOut(window._auth.auth);
  const ed=$("#edit");if(ed)ed.onclick=()=>{ST.step=0;tab="config";ST.wiz.done=0;render();scrollTo(0,0)};
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;try{localStorage.setItem("paris_tab",tab)}catch(e){}render()});
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filt=b.dataset.f;render()});
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{open=b.dataset.open;render()});
  document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{open=null;render()});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const [ini,id]=b.dataset.del.split("|");ST.esc=ST.esc.filter(e=>!(e.ini===ini&&e.id===id));save();render()});
  document.querySelectorAll("form[data-plan]").forEach(f=>{const id=f.dataset.plan,w=$("#pw-"+id);
    const chk=()=>{const ini=f.ini.value,n=+f.n.value,fin=ini?add(ini,n):"";let m="";
      if(ini&&W.eur_fecha&&(ini<W.eur_fecha||fin>W.vue_fecha))m="⚠ Queda fuera de las fechas en Francia.";else if(ini&&overlap(ini,fin))m="⚠ Se cruza con otra escapada ya elegida.";
      else if(ini)m=`Vuelven a París el ${pretty(fin)}.`;w.textContent=m;w.style.color=m.startsWith("⚠")?"":"var(--ok)";return !m.startsWith("⚠")};
    f.oninput=chk;chk();
    f.onsubmit=e=>{e.preventDefault();if(!chk())return;ST.esc.push({id,ini:f.ini.value,fin:add(f.ini.value,+f.n.value)});open=null;save();render()}})}
