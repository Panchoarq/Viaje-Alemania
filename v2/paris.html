<!doctype html>
<html lang="es" data-sty="retro" data-paper="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viaje a París · Marco Polo (v2)</title>
<meta name="theme-color" content="#efe4cc">
<link rel="icon" href="/img/logo-marcopolo.jpg">
<link rel="apple-touch-icon" href="/img/logo-marcopolo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Courier+Prime:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>[hidden]{display:none!important}

/* Layout: cuaderno de viaje antiguo — papel, boletos perforados, sellos; resumen arriba, pestañas: Configurar · Programa · Alojamiento · Pasajes */
:root{
  --bg:#efe4cc; --card:#f8f0dc; --ink:#2a2420; --muted:#6f6352; --line:#cdbb98;
  --mun:#24477a; --pra:#9b2f24; --ber:#9a6a12; --ham:#2e6b62; --sea:#c9d7d2; --land:#f4ead2; --land2:#e6d9bb; --border:#a8956f; --ok:#3d6b3a; --est:#9a6a12; --bad:#9b2f24;
  --chip:#e7d9b9; --out:#7a3b69; --stamp:#9b2f24;
  --f-display:"Playfair Display", Georgia, serif;
  --f-body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --fs:17.5px;
  --f-mono:"Courier Prime", "Courier New", Courier, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1915; --card:#262119; --ink:#efe3c8; --muted:#b3a382; --line:#4a4130;
  --mun:#8fb0e0; --pra:#e0897b; --ber:#e2b85c; --ham:#7fc3b7; --sea:#1f2a2a; --land:#2b2519; --land2:#231f16; --border:#6b5d43; --ok:#8cc286; --est:#e2b85c; --bad:#e0897b; --chip:#332c20; --out:#d39ac4; --stamp:#e0897b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1915; --card:#262119; --ink:#efe3c8; --muted:#b3a382; --line:#4a4130;
  --mun:#8fb0e0; --pra:#e0897b; --ber:#e2b85c; --ham:#7fc3b7; --sea:#1f2a2a; --land:#2b2519; --land2:#231f16; --border:#6b5d43; --ok:#8cc286; --est:#e2b85c; --bad:#e0897b; --chip:#332c20; --out:#d39ac4; --stamp:#e0897b; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.5;
  background-image:radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--card) 60%,transparent) 0,transparent 40%),radial-gradient(circle at 80% 90%,color-mix(in srgb,var(--line) 35%,transparent) 0,transparent 45%)}
.wrap{max-width:1080px;margin:0 auto;padding-block:26px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:clamp(32px,6vw,54px);line-height:1.05;letter-spacing:.005em;font-weight:800}
h2{font-size:27px;font-weight:700} h3{font-size:21px;font-weight:700}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} a{color:var(--mun)}
header{display:flex;flex-direction:column;gap:10px}
.why{font-size:14px;margin-top:3px}.why summary{cursor:pointer;color:var(--accent,#a33);font-size:13px}.why[open]{background:color-mix(in srgb,currentColor 6%,transparent);padding:4px 8px;border-radius:6px}.route{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:13px}
.stop{padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.stop.M{border-color:var(--mun);color:var(--mun)} .stop.P{border-color:var(--pra);color:var(--pra)} .stop.B{border-color:var(--ber);color:var(--ber)} .stop.H{border-color:var(--ham);color:var(--ham)}
.arrow{color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .big{font-family:var(--f-mono);font-size:23px;font-weight:500}
.tile.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tile.main .eyebrow{color:inherit;opacity:.75}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--chip)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:inherit;font-weight:600;font-size:14px;padding:10px 14px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.panel{display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 22px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:0}
.field>label,.field>span{color:var(--muted);font-weight:500}
input[type=number],input[type=date],select{font-family:var(--f-mono);font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);max-width:100%}
input[type=number]{width:100%;max-width:110px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,label.chk:focus-within,label.opt:focus-within{outline:2px solid var(--mun);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap;align-self:flex-start}
.seg button{font:inherit;font-size:13px;padding:6px 12px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.nights{display:flex;flex-direction:column;gap:8px}
.nights .end{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;border:1px dashed var(--line);color:var(--muted);font-size:13.5px}
.nights .arr{color:var(--muted);font-size:12px;padding-left:14px;font-family:var(--f-mono)}
.routegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.routegrid{grid-template-columns:1fr}}
#map svg{width:100%;height:auto;max-height:520px;display:block}
.nights .n{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);border-left:5px solid var(--c)}
.n.M{--c:var(--mun)}.n.P{--c:var(--pra)}.n.B{--c:var(--ber)}.n.H{--c:var(--ham)}
.basis{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px}
.v{color:var(--ok);font-weight:600}.e{color:var(--est);font-weight:600}
.city{display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--c);padding-top:12px}
.city.M{--c:var(--mun)}.city.P{--c:var(--pra)}.city.B{--c:var(--ber)}.city.H{--c:var(--ham)}
.hotels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
label.opt{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;min-width:0}
label.opt:has(input:checked){border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.opt-top{display:flex;gap:10px;align-items:flex-start}
.opt-top input{margin-top:5px;accent-color:var(--c)}
.opt-top .name{flex:1;min-width:0;font-weight:600;font-size:16px}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.sel{background:var(--c);color:var(--bg)}
dl.facts{display:flex;flex-direction:column;gap:0;margin:0;font-size:14px}
dl.facts dt{color:var(--muted);font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-top:9px} dl.facts dt:first-child{margin-top:0} dl.facts dd{margin:2px 0 0;min-width:0;width:100%} dl.facts dd input[type=number]{width:110px}
.links-row{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;font-weight:500}
.legs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.legcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.legcard .od{font-family:var(--f-display);font-size:17px;font-weight:700}
.legcard .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.days{display:flex;flex-direction:column;gap:14px}
.day{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:10px 20px}
.day.M{--c:var(--mun)} .day.P{--c:var(--pra)} .day.B{--c:var(--ber)} .day.H{--c:var(--ham)}
.day-head{display:flex;flex-direction:column;gap:2px;min-width:0}
.day-total{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.day-total .big{font-family:var(--f-mono);font-size:20px;font-weight:500}
.day-body{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px 22px}
.blk{display:flex;flex-direction:column;gap:6px;min-width:0}
.blk h4{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer;padding:2px 0}
label.chk input{margin-top:4px;accent-color:var(--c)}
label.chk .t{flex:1;min-width:0}
label.chk .t small{display:block;color:var(--muted);font-size:12px}
label.chk .p,.line .p{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--muted);margin-left:4px}
.tag.free{color:var(--ok)}
.line{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.leg{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--chip)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right;font-family:var(--f-mono)}
tr.best td{font-weight:600}
.verdict{border-left:5px solid var(--ok);padding:12px 16px;background:var(--chip);border-radius:8px;font-size:14.5px}
.note{font-size:13px;color:var(--muted);max-width:80ch}
.warn{background:var(--chip);border-radius:10px;padding:12px 16px;font-size:14px}
.err{color:var(--bad);font-size:13px}
.tl{font-size:13px;margin-top:4px;padding:6px 10px;border-radius:6px;background:var(--chip);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.feas{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.fcard{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.fcard.M{--c:var(--mun)}.fcard.P{--c:var(--pra)}.fcard.B{--c:var(--ber)}.fcard.H{--c:var(--ham)}
.meter{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}.meter span{display:block;height:100%}
.status{font-size:13px;font-weight:600}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}
details.pool summary{cursor:pointer;font-size:13px;color:var(--muted)}
label.vchk{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;cursor:pointer;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
label.vchk:has(input:checked){border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
label.vchk input{accent-color:var(--ok);margin:0}
.pricebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:560px){.day{grid-template-columns:1fr}.day-total{align-items:flex-start;text-align:left}}

/* Estilo moderno (anterior) */
:root[data-sty="mod"]{
  --bg:#f3f4f1; --card:#ffffff; --ink:#1d2430; --muted:#5f6876; --line:#d9ddd6;
  --mun:#1f5fa8; --pra:#b23a32; --ber:#a87800; --ham:#0b7a75; --sea:#dbe7ef; --land:#f7f6f1; --land2:#ece9df; --border:#b9b4a5; --ok:#2f7a4f; --est:#8a5a00; --bad:#b23a32;
  --chip:#eef0ec; --out:#7a3b69; --stamp:#b23a32;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; --fs:15.5px}
@media (prefers-color-scheme: dark){:root[data-sty="mod"]:not([data-theme="light"]){
  --bg:#14171c; --card:#1d2129; --ink:#e8eaee; --muted:#9aa3b0; --line:#2f3540;
  --mun:#6fa3e6; --pra:#e47a70; --ber:#e8bb3c; --ham:#4fc7bf; --sea:#18222c; --land:#262b34; --land2:#20242c; --border:#4a5160; --ok:#5fbf86; --est:#e8bb3c; --bad:#e47a70; --chip:#262b34; --out:#d39ac4; --stamp:#e47a70}}
:root[data-sty="mod"][data-theme="dark"]{
  --bg:#14171c; --card:#1d2129; --ink:#e8eaee; --muted:#9aa3b0; --line:#2f3540;
  --mun:#6fa3e6; --pra:#e47a70; --ber:#e8bb3c; --ham:#4fc7bf; --sea:#18222c; --land:#262b34; --land2:#20242c; --border:#4a5160; --ok:#5fbf86; --est:#e8bb3c; --bad:#e47a70; --chip:#262b34; --out:#d39ac4; --stamp:#e47a70}
:root[data-sty="mod"] body{background-image:none}
:root[data-sty="mod"] h1{font-weight:700;letter-spacing:-.01em}
:root[data-sty="mod"] h2,:root[data-sty="mod"] h3{font-weight:700}
.stylebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}

.tk-ok{align-self:flex-end;margin-top:-6px;transform:rotate(-4deg);font-family:"Courier Prime",monospace;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:#2f6b2c;border:2px solid #2f6b2c;padding:2px 8px;border-radius:3px}
.tk-edit summary{cursor:pointer;font-size:13px;font-family:"Courier Prime",monospace}
.tk-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
.tk-form label{display:flex;flex-direction:column;gap:2px;font-size:12px;font-family:"Courier Prime",monospace}
.tk-form input{font:inherit;font-size:14px;padding:4px 6px;background:#fffaf0;color:#2a2420;border:1px solid var(--tk-acc,#7a4f2e);border-radius:2px}

.tk-go{display:flex;flex-direction:column;gap:4px;border:1px dashed color-mix(in srgb,var(--tk-ink,#5a3a22) 55%,transparent);padding:8px 10px;font-size:14px}
.tk-go b{font-family:"Courier Prime",monospace}
.tk-go a{color:var(--tk-ink,#5a3a22);font-weight:700}
.tk-times{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:"Courier Prime",monospace;font-size:14px}
.anum{display:inline-block;min-width:1.5em;text-align:center;border:1.5px solid currentColor;border-radius:50%;font-size:12px;line-height:1.4em;margin-right:2px}.st{font-size:13px;opacity:.75}.lunch{font-size:14px;padding:6px 10px;margin:4px 0;border:1px dashed var(--line,#999);border-radius:6px}.route{display:block;margin:10px 0 6px;font-weight:600}.seg{display:block;margin-top:10px}


/* Capa vintage: bordes de cuaderno, boletos perforados y sellos */
:root[data-sty="retro"] header{border-bottom:3px double var(--ink);padding-bottom:14px}
:root[data-sty="retro"] header .eyebrow::before{content:"✈ ";}
:root[data-sty="retro"] .tile,:root[data-sty="retro"] .card,:root[data-sty="retro"] .day,:root[data-sty="retro"] .legcard,:root[data-sty="retro"] .links section,:root[data-sty="retro"] label.opt,:root[data-sty="retro"] .fcard{border-radius:4px;box-shadow:0 1px 0 var(--line),0 6px 14px -10px color-mix(in srgb,var(--ink) 40%,transparent)}
:root[data-sty="retro"] .card,:root[data-sty="retro"] .day,:root[data-sty="retro"] .fcard{border:1px solid var(--line);outline:1px solid var(--line);outline-offset:-5px}
:root[data-sty="retro"] .tile.main{background:var(--ink);color:var(--bg);font-family:var(--f-mono)}
:root[data-sty="retro"] .tile .big,:root[data-sty="retro"] .day-total .big{font-family:var(--f-mono);font-weight:700}
:root[data-sty="retro"] .tabs{border-bottom:2px solid var(--ink)}
:root[data-sty="retro"] .tabs button{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em;font-size:13px}
:root[data-sty="retro"] .tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-bottom-color:var(--ink);border-radius:4px 4px 0 0}
:root[data-sty="retro"] .legcard{position:relative;border:1px dashed var(--border);background:var(--card);
  -webkit-mask:radial-gradient(circle 9px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 9px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat}
:root[data-sty="retro"] .legcard .od{font-family:var(--f-display);font-weight:400;font-size:20px}
:root[data-sty="retro"] .pill,:root[data-sty="retro"] .tag{font-family:var(--f-mono);border-radius:2px}
:root[data-sty="retro"] .pill.sel{transform:rotate(-3deg);border:2px solid var(--c);background:transparent;color:var(--c);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
:root[data-sty="retro"] .stop{font-family:var(--f-mono);border-radius:2px;border-style:dashed}
:root[data-sty="retro"] .route{font-family:var(--f-mono)}
:root[data-sty="retro"] .tl{border-left:3px solid var(--stamp);border-radius:0}
:root[data-sty="retro"] .status.bad::before{content:"✕ "}
:root[data-sty="retro"] input[type=number],:root[data-sty="retro"] input[type=date],:root[data-sty="retro"] select{border-radius:2px;background:var(--card)}
/* Tipo de traslado por actividad */
.tr{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:2px;margin-left:4px;white-space:nowrap;border:1px solid currentColor}
.tr.pie{color:var(--ok)}.tr.metro{color:var(--mun)}.tr.fuera{color:#fff;background:var(--out);border-color:var(--out)}
.top{font-family:var(--f-mono);font-size:11px;color:var(--stamp);margin-left:4px}
label.chk.fuera{background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--out) 10%,transparent) 0 6px,transparent 6px 12px);border:1px dashed var(--out);border-radius:3px;padding:4px 6px}
.legendtr{display:flex;flex-wrap:wrap;gap:12px;font-size:14px;align-items:center}
.nights .arr input[type=time]{font-family:var(--f-mono);font-size:13px;padding:2px 4px;border:1px solid var(--line);border-radius:2px;background:var(--card);color:var(--ink)}
.mv{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-left:30px}
.recbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{font:inherit;font-size:13.5px;padding:6px 10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:3px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink)}
.actrow{display:flex;gap:8px;align-items:flex-start;font-size:15px;padding:2px 0}
.rm{font:inherit;font-size:12px;line-height:1;width:22px;height:22px;flex:none;margin-top:2px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:2px;cursor:pointer}
.rm:hover{color:var(--bad);border-color:var(--bad)}
.sugg{border:1px dashed var(--stamp);padding:8px 10px;border-radius:3px;font-size:14px;background:color-mix(in srgb,var(--stamp) 6%,transparent)}


/* Boletos de tren */
.legs[data-tk="A"],.legs[data-tk="B"],.legs[data-tk="C"]{grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:18px}
.ticket{--tk-bg:#efe1c6;--tk-ink:#5a3a22;--tk-acc:#7a4f2e;--tk-on:#f3e6cc;display:grid;grid-template-columns:minmax(0,1fr) 72px;background:var(--tk-bg);color:var(--tk-ink);min-width:0;
  -webkit-mask:radial-gradient(circle at 0 9px,#0000 6px,#000 6.5px) 0 0/51% 18px repeat-y,radial-gradient(circle at 100% 9px,#0000 6px,#000 6.5px) 100% 0/51% 18px repeat-y;
          mask:radial-gradient(circle at 0 9px,#0000 6px,#000 6.5px) 0 0/51% 18px repeat-y,radial-gradient(circle at 100% 9px,#0000 6px,#000 6.5px) 100% 0/51% 18px repeat-y;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.tk-main{padding:16px 14px 14px 22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tk-band{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--tk-acc);color:var(--tk-on);padding:8px 12px;outline:1px solid var(--tk-on);outline-offset:-4px}
.tk-band b{font-family:"Playfair Display",Georgia,serif;font-size:clamp(20px,3.4vw,28px);letter-spacing:.04em;text-transform:uppercase}
.tk-op{font-family:"Courier Prime",monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.tk-body{display:grid;grid-template-columns:190px minmax(0,1fr) 92px;gap:12px;align-items:center}
.tk-art .tk-img{width:100%;height:auto;display:block}
dl.tk-f dd.hi{color:#a8352b;font-weight:700}
.tk-art{color:var(--tk-acc)} .tk-art svg{width:100%;height:auto;display:block}
dl.tk-f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin:0;border:1px solid color-mix(in srgb,var(--tk-ink) 45%,transparent);padding:8px 10px}
dl.tk-f .wide{grid-column:1/-1}
dl.tk-f dt{font-family:"Courier Prime",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.8}
dl.tk-f dd{margin:0;font-family:"Courier Prime",monospace;font-size:15px;letter-spacing:.04em}
.tk-price{width:92px;height:92px;border-radius:50%;background:var(--tk-acc);color:var(--tk-on);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;outline:2px solid var(--tk-on);outline-offset:-6px}
.tk-price b{font-family:"Playfair Display",Georgia,serif;font-size:21px;line-height:1}
.tk-price small{font-family:"Courier Prime",monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase}
.tk-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px dashed color-mix(in srgb,var(--tk-ink) 50%,transparent);padding-top:8px;font-size:14px}
.tk-foot a{color:var(--tk-ink);font-weight:700}
.tk-foot input{background:#fffaf0;color:#2a2420;border:1px solid var(--tk-acc)}
.ticket label.vchk{border-color:var(--tk-acc);color:var(--tk-ink)}
.tk-stub{background:var(--tk-acc);color:var(--tk-on);border-left:2px dashed var(--tk-on);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 4px;writing-mode:vertical-rl;transform:rotate(180deg)}
.tk-v{font-family:"Playfair Display",Georgia,serif;font-size:19px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--tk-on);padding:8px 4px}
.tk-no{font-family:"Courier Prime",monospace;font-size:12px}
/* B · grabado con doble filete rojo */
.legs[data-tk="B"] .ticket{--tk-bg:#f1e6cf;--tk-ink:#2b2622;--tk-acc:#2b2622;--tk-on:#f1e6cf;box-shadow:inset 0 0 0 10px var(--tk-bg),inset 0 0 0 12px #a8352b}
.legs[data-tk="B"] .tk-band{background:transparent;color:var(--tk-ink);outline:none;border-bottom:2px solid #a8352b;justify-content:center;flex-direction:column;align-items:center;text-align:center}
.legs[data-tk="B"] .tk-band b{font-family:"Courier Prime",monospace;font-weight:700;font-size:clamp(22px,3.8vw,32px);letter-spacing:.06em}
.legs[data-tk="B"] .tk-art{color:#55504a}
.legs[data-tk="B"] .tk-price{background:transparent;color:#a8352b;outline-color:#a8352b;border:2px solid #a8352b}
.legs[data-tk="B"] .tk-stub{background:var(--tk-bg);color:var(--tk-ink);border-left:2px solid #a8352b}
.legs[data-tk="B"] .tk-v{font-family:"Courier Prime",monospace;border-color:#a8352b}
/* C · estación, talón rojo de control */
.legs[data-tk="C"] .ticket{--tk-bg:#f6cfae;--tk-ink:#3a2418;--tk-acc:#3a2418;--tk-on:#f6cfae}
.legs[data-tk="C"] .tk-band{background:transparent;color:var(--tk-ink);outline:none;border-top:1px solid var(--tk-ink);border-bottom:1px solid var(--tk-ink)}
.legs[data-tk="C"] .tk-band b{font-family:"Playfair Display",Georgia,serif;letter-spacing:.14em}
.legs[data-tk="C"] .tk-price{background:transparent;color:var(--tk-ink);outline:none;border:1px solid var(--tk-ink);border-radius:2px;height:auto;padding:10px 4px}
.legs[data-tk="C"] .tk-stub{background:#d9574a;color:#fff3e8;border-left:2px dashed #3a2418}
.legs[data-tk="C"] .tk-v{font-family:"Courier Prime",monospace;letter-spacing:.2em;border:none}
@media (max-width:760px){.tk-body{grid-template-columns:130px minmax(0,1fr) 92px}}
@media (max-width:560px){.tk-body{grid-template-columns:minmax(0,1fr)}.tk-art{width:min(230px,80%);margin:0 auto}.tk-price{grid-column:1/-1;justify-self:end;width:80px;height:80px}.ticket{grid-template-columns:minmax(0,1fr) 52px}.tk-v{font-size:15px}}
/* Timbre 16 años */
label.opt{position:relative}
label.opt .links-row{padding-right:118px}
.stamp16{position:absolute;right:10px;bottom:8px;width:80px;padding:4px 3px;text-align:center;color:#b0261c;border:3px double #b0261c;border-radius:8px;transform:rotate(-12deg);font-family:"Courier Prime",monospace;text-transform:uppercase;line-height:1.05;opacity:.88;pointer-events:none;
  background:radial-gradient(circle,transparent 60%,rgba(176,38,28,.06) 100%);mix-blend-mode:multiply}
.stamp16 b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:15px;letter-spacing:.02em}
.stamp16 span{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;border-top:1px solid currentColor;border-bottom:1px solid currentColor;margin:3px 0;padding:1px 0}
.stamp16 small{display:block;font-size:7px;letter-spacing:.06em}
.stamp16.pend{color:var(--muted);border-style:dashed;transform:rotate(-6deg);opacity:.7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stamp16{mix-blend-mode:normal;color:#ef7d70}}
:root[data-theme="dark"] .stamp16{mix-blend-mode:normal;color:#ef7d70}
.tag.pass{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ink)}
label.opt:has(.stamp16){padding-bottom:78px}
.pill.sel,:root[data-sty="retro"] .pill.sel{font-size:15px;padding:5px 12px;background:#2e7d32;color:#fff;border:2px solid #1b5e20;border-radius:6px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;transform:rotate(-3deg);box-shadow:0 2px 0 #1b5e20}
label.opt:has(input:checked){border-color:#2e7d32;box-shadow:inset 0 0 0 2px #2e7d32}

.stayl{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:2px 0;border-bottom:1px dotted var(--line)}.stayl b{font-family:var(--f-mono);white-space:nowrap}.stayl.tot{border-bottom:0;border-top:2px solid var(--ink);margin-top:3px;padding-top:4px;font-weight:700}
select[data-rmode]{font-size:13px;padding:5px 6px}
.buy h3{margin:4px 0 8px}.buylist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:12px}.buylist li p{margin:4px 0;font-size:14.5px}.buylist li.done{opacity:.55}.buylist li.done b{text-decoration:line-through}
.buylist label{cursor:pointer}.cost{font-family:var(--f-mono);font-size:13px;font-weight:700}.tag.urgt{background:#b0261c;color:#fff}
.buycities{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:14px}.buycities .card{border-top:4px solid var(--c)}.buycities ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
/* Fichas de archivo */
.attbar{display:flex;flex-wrap:wrap;gap:8px}
.ctx p{max-width:72ch}.tlsvg{width:100%;height:auto;max-width:760px;display:block;margin:6px 0 4px;color:var(--ink)}
.fichas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:22px;margin-top:6px}
.ficha{position:relative;background:color-mix(in srgb,#d8b979 22%,var(--card));color:var(--ink);border:1px solid color-mix(in srgb,#8a6b2f 45%,var(--line));border-radius:2px 10px 4px 4px;padding:30px 20px 18px;min-width:0;box-shadow:0 2px 0 color-mix(in srgb,#8a6b2f 30%,transparent);display:flex;flex-direction:column;gap:10px}
.ficha .ftab{position:absolute;top:-14px;left:16px;background:color-mix(in srgb,#d8b979 40%,var(--card));border:1px solid color-mix(in srgb,#8a6b2f 45%,var(--line));border-bottom:0;border-radius:6px 6px 0 0;padding:3px 12px;font-family:"Courier Prime",monospace;font-size:12px;letter-spacing:.08em;font-weight:700}
.ficha header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.ficha h3{font-size:23px;margin:0}.fy{font-family:"Courier Prime",monospace;font-size:13px;color:var(--muted)}
.fstamp{font-family:"Courier Prime",monospace;font-size:11px;font-weight:700;letter-spacing:.1em;color:#b0261c;border:2px solid currentColor;padding:1px 6px;transform:rotate(-3deg);display:inline-block}
.fstamp.ok{color:#2e7d32}
.flead{font-size:16.5px;font-style:italic;margin:0}
.flab{display:block;font-family:"Courier Prime",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px;border-bottom:1px dashed var(--line)}
.ficha p{margin:4px 0;font-size:15px;line-height:1.55}
.fnote{background:color-mix(in srgb,#fff59a 35%,transparent);padding:6px 10px;border-left:3px solid #d4b400}
.fphotos{display:flex;flex-wrap:wrap;gap:16px;padding-top:8px}
.polaroid{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:150px;padding:10px 10px 8px;background:#fdfbf4;color:#2a2620;border:1px solid #d9d2c0;box-shadow:0 2px 4px rgba(0,0,0,.18);text-decoration:none;transform:rotate(-1.5deg)}
.polaroid:nth-child(even){transform:rotate(1.6deg)}.polaroid:hover,.polaroid:focus-visible{transform:rotate(0) scale(1.03)}
.polaroid .ph{width:100%;height:76px;display:grid;place-items:center;font-size:30px;background:repeating-linear-gradient(45deg,#e7e1d0 0 6px,#efe9da 6px 12px)}
.polaroid .cap{font-size:13px;text-align:center;line-height:1.25;font-weight:600}.polaroid .go{font-size:11px;color:#6d6455;font-family:"Courier Prime",monospace}
.polaroid .clip{position:absolute;top:-12px;left:18px;width:14px;height:34px;border:3px solid #8f969c;border-radius:8px;border-bottom-color:transparent}
.flinks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.ficha.flash{outline:3px solid var(--stamp);outline-offset:3px}
.brief{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.mitem{border:1px solid var(--line);padding:10px 12px;border-radius:4px;min-width:0}.mitem small{display:block;color:var(--muted);font-size:12.5px}.mitem p{margin:4px 0 0;font-size:14px}
.tag.hotel{background:color-mix(in srgb,var(--mun) 20%,transparent);color:var(--ink)}
.msel{margin:-2px 0 6px 28px;max-width:calc(100% - 28px);font-size:13px;padding:4px 6px}
.polaroid{width:190px}.polaroid img.ph{width:100%;height:120px;object-fit:cover;display:block;background:#ddd}.polaroid .ph{height:120px}.credit{font-size:11px;color:var(--muted);margin:2px 0 0}
.neu{border-top:1px dashed var(--line);padding-top:10px;margin-top:6px}.neu h4{margin:0 0 4px}
.daytabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:6px 0 2px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0}
.dtab{font:inherit;text-align:left;cursor:pointer;padding:8px 12px;border:1px solid var(--line);border-top:4px solid var(--c);background:var(--card);color:var(--ink);border-radius:6px;display:flex;flex-direction:column;gap:1px}
.dtab small{font-size:12px;color:var(--muted)}.dtab[aria-selected="true"]{background:var(--c);color:var(--bg);border-color:var(--c)}.dtab[aria-selected="true"] small{color:inherit;opacity:.85}
.dtab.M{--c:var(--mun)}.dtab.P{--c:var(--pra)}.dtab.B{--c:var(--ber)}.dtab.H{--c:var(--ham)}

/* Pestañas de ciudad tipo carpeta con clip */
#p-prog #daytabs,#p-hot #hottabs{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;padding:14px 0 0;margin:0;border-bottom:0}
#hotels > .city[hidden]{display:none!important}
.teen{font-size:13px;white-space:nowrap}.legendtr .teen,.poolrow .teen{font-size:12.5px;color:#4b3f9a;font-weight:700}
/* ===== Zonas de precaución ===== */
.riskbox{margin:8px 0;border-left:5px solid #b3261e;border-radius:4px;background:repeating-linear-gradient(135deg,color-mix(in srgb,#b3261e 9%,var(--card)) 0 6px,color-mix(in srgb,#b3261e 4%,var(--card)) 6px 12px);padding:6px 10px;font-size:13.5px}
.riskbox summary{cursor:pointer;font-weight:700;color:#8e1d14;list-style:none}
.riskbox summary::-webkit-details-marker{display:none}
.riskbox summary::after{content:" ▸";font-weight:400}.riskbox[open] summary::after{content:" ▾"}
.riskbox p{margin:6px 0 0}
/* ===== Traslados y almuerzo ===== */
.mv.tr{border:0!important;border-left:5px solid #b5432f!important;border-radius:3px!important;background:color-mix(in srgb,var(--ink) 4%,var(--card));box-shadow:0 1px 3px rgba(40,30,15,.12);padding:5px 8px 5px 9px!important;margin:6px 0!important;font-size:12.5px}
.mv.tr.subway{border-left-color:#1f4fb5!important}
.mv.tr.light_rail,.mv.tr.train{border-left-color:#1e8a3c!important}
.mv.tr.bus{border-left-color:#8a3fa3!important}
.mv.tr.tram{border-left-color:#c8401f!important}
.lunch{border:0!important;border-left:5px solid #9a6a2f!important;border-radius:4px;padding:8px 10px!important;background:repeating-linear-gradient(135deg,color-mix(in srgb,#c8a06a 22%,var(--card)) 0 7px,color-mix(in srgb,#c8a06a 12%,var(--card)) 7px 14px);font-weight:600}
.lunch b{color:#7a4a17}
/* ===== Plegado del día (todas las pantallas) ===== */
#days > .day .day-body{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)!important;grid-template-areas:"att com" "att tr" "att ." ;align-items:start}
#days > .day .blk-att{grid-area:att}#days > .day .blk-com{grid-area:com}#days > .day .blk-tr{grid-area:tr}
.blk-com > h4,.blk-tr > h4{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:10px 0 6px;border-top:2px solid var(--ink);font-size:12px;user-select:none}
.blk-com > h4::after,.blk-tr > h4::after{content:"▸ ver";font-weight:400;letter-spacing:0;text-transform:none}
.blk-com.open > h4::after,.blk-tr.open > h4::after{content:"▾ ocultar"}
.blk-com:not(.open) > :not(h4),.blk-tr:not(.open) > :not(h4){display:none!important}
.actrow2 .ar-top{cursor:pointer}
.actrow2:not(.open) .ar-ctl,.actrow2:not(.open) .ar-note,.actrow2:not(.open) .ar-links,.actrow2:not(.open) .why{display:none!important}
.actrow2:not(.open) .ar-meta{display:none}
.actrow2 .ar-meta .ar-price{display:none}
.ar-pmini{display:inline-block;flex:none;margin-left:auto;font:700 12px "Courier Prime",ui-monospace,monospace;background:var(--ink);color:var(--bg);padding:2px 6px;border-radius:3px;white-space:nowrap}
.ar-pmini.free{background:color-mix(in srgb,var(--ink) 12%,transparent);color:var(--ink)}
.ar-latemini{display:none}
.actrow2:not(.open) .ar-name:has(.ar-latemini)::after{content:none}
.actrow2:not(.open) .ar-latemini{display:block;font:600 11.5px "Courier Prime",ui-monospace,monospace;color:#8e1d14;margin-top:2px}
.actrow2:not(.open) .ar-name::after{content:" ▸";font-size:12px;color:var(--muted)}
.actrow2.open{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.actrow2.open .ar-top{flex-wrap:wrap}
.actrow2.open .ar-ctl{display:flex;flex:1 1 100%;order:9;margin:2px 0 0 calc(1.75em + 8px);gap:5px;flex-wrap:wrap}
.actrow2.open{gap:6px}.actrow2.open .ar-top{row-gap:4px}
.blk-att .mv.tr{display:block;max-width:100%;box-sizing:border-box;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.blk-att{min-width:0;max-width:100%}
.blk-att .mv.tr.full{white-space:normal}

.dchips,.feasmini{display:none}

.lk{font-size:13px;line-height:1;padding:3px 4px;border:1px solid var(--line);background:var(--card);border-radius:4px;cursor:pointer;filter:grayscale(1);opacity:.45;margin-right:3px}

header h1{font-family:"Courier Prime",ui-monospace,"Courier New",monospace !important;font-weight:700;letter-spacing:-.01em;font-size:clamp(30px,5.4vw,50px);line-height:1.08}
.sync-chip{position:fixed;right:12px;bottom:12px;z-index:60;font:600 12px/1.2 system-ui,sans-serif;padding:7px 11px;border-radius:999px;background:#1f3d2b;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:.92}

.boot-msg{padding:40px 16px;text-align:center;font:600 15px system-ui,sans-serif;opacity:.7}
@media print{.sync-chip,.sync-bar{display:none}}
.xfer-btn{position:fixed;left:12px;bottom:12px;z-index:60;font:600 12px system-ui,sans-serif;padding:7px 11px;border-radius:999px;border:1px solid rgba(0,0,0,.25);background:#fff;color:#222;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);opacity:.9}

header.has-sticker{position:relative;padding-right:clamp(130px,24vw,240px);min-height:clamp(150px,26vw,250px)}
.sticker{position:absolute;top:-6px;right:0;width:clamp(120px,22vw,220px);transform:rotate(4deg);background:#fffdf6;padding:7px 7px 9px;border-radius:6px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 8px 18px rgba(40,25,10,.28);transition:transform .2s ease;z-index:2;display:block;line-height:0}
