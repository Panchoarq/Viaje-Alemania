@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    const pays=PAYS.filter(p=>!P.medios||P.medios.includes(p));
    const g={ts:Date.now(),d:today,amt:a,cur,eur:Math.round(toEUR(a,cur)*100)/100,cat:form.cat||suggest(form.com),pay:form.pay||(pays.includes("Global66")?"Global66":pays[0]),com:form.com.trim(),city,ll:form.loc?form.ll:null,shared:form.shared};
    sv.disabled=true;try{await addGasto(g);toast("✓ Guardado"+(navigator.onLine?"":" (se sincroniza con señal)"))}catch(e){toast("No se pudo guardar");sv.disabled=false;return}
    form={...form,amt:"",com:"",cat:null,shared:false};render()};
  const rt=$("#retiro");if(rt)rt.onclick=()=>sheet(`<span class="eb">Retiro en cajero</span><div class="k2"><label class="fld">Monto<input id="rm" inputmode="decimal"></label><label class="fld">Moneda<select id="rc"><option value="EUR">€</option><option value="${T.c2.code}" ${curOfCity(cityOn(todayISO()))===T.c2.code?"selected":""}>${T.c2.sym}</option></select></label></div><label class="fld">Desde<select id="rp">${PAYS.filter(p=>p!=="Efectivo").map(p=>`<option>${p}</option>`).join("")}</select></label><span class="sub">Suma al efectivo; no cuenta como gasto. Elegir siempre cobrar en la moneda local.</span><button class="go" id="rok">Registrar retiro</button>`,
    d=>{d.querySelector("#rok").onclick=async()=>{const a=parseFloat(d.querySelector("#rm").value.replace(",","."))||0;if(!(a>0))return;const cur=d.querySelector("#rc").value;d.remove();
      const g={ts:Date.now(),d:todayISO(),amt:a,cur,eur:Math.round(toEUR(a,cur)*100)/100,cat:"Retiro",pay:d.querySelector("#rp").value,com:"Retiro de efectivo",city:cityOn(todayISO()),ll:form.ll,retiro:true,shared:false};
      await addGasto(g);toast("✓ Retiro registrado")}});
  const mic=$("#mic");if(mic)mic.onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){toast("Usa el micrófono del teclado");$("#com").focus();return}
    const r=new SR();r.lang="es-CL";r.interimResults=false;r.maxAlternatives=1;mic.classList.add("on");$("#micT").textContent="Escuchando…";
    r.onresult=e=>{const t=e.results[0][0].transcript;const v=parseVoice(t);if(v.amount)form.amt=String(v.amount).replace(".",",");form.com=v.com||t;if(!form.cat)form.cat=null;form._sug=v.cat;if(v.cur)form.cur=v.cur;form.cat=v.cat;render();toast("«"+t+"»")};
    r.onerror=()=>{toast("No te escuché: prueba otra vez");mic.classList.remove("on")};r.onend=()=>{mic.classList.remove("on");const m=$("#micT");if(m)m.textContent="Dictar el gasto"};r.start()};
  // resumen y mapa
  Q("[data-rv]",b=>b.onclick=()=>{rv=b.dataset.rv;render()});
  Q("[data-mf]",b=>b.onclick=()=>{mapF=b.dataset.mf;render()});
  // ajustes
  const ss=$("#s-save");if(ss)ss.onclick=async()=>{const n=v=>parseFloat(String(v).replace(/\./g,"").replace(",","."))||0;const f=v=>parseFloat(String(v).replace(",","."))||0;
    await saveProf({nombre:$("#s-nom").value.trim(),pres:n($("#s-pres").value),cashEUR:f($("#s-ce").value),[T.c2.ck]:f($("#s-cg").value),rateCLP:n($("#s-rc").value)||1100,[T.c2.rk]:f($("#s-rg").value)||T.c2.def,
      medios:[...document.querySelectorAll("[data-med]")].filter(x=>x.checked).map(x=>x.dataset.med)});toast("✓ Guardado")};
  Q("[data-delcat]",b=>b.onclick=()=>saveProf({cats:(P.cats||[]).filter(c=>c!==b.dataset.delcat)}));
  const out=$("#out");if(out)out.onclick=()=>window._au.U.signOut(window._au.auth)}
// primera vez: ir a Ajustes si no hay presupuesto
let first=true;const _r=render;
boot().then(()=>{});
setTimeout(()=>{if(first&&user&&!P.pres){tab="set";render()}first=false},1500);
</script>
